<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#102238" />
  <title>PIERLINE — 2D Pixel Fishing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-shell">
    <canvas id="game-canvas" aria-label="Pierline pixel art fishing game"></canvas>

    <!-- Top HUD -->
    <header id="hud-top">
      <div class="hud-group hud-stats">
        <div class="pixel-pill" title="Coins">
          <span class="coin-dot"></span>
          <span id="hud-coins">0</span>
        </div>
        <div class="pixel-pill" title="Fish caught">
          <span class="pill-label">CATCH</span>
          <span id="hud-caught">0</span>
        </div>
        <div class="pixel-pill hide-xs" title="Time of day">
          <span id="hud-time">DAY</span>
        </div>
      </div>

      <div class="hud-group hud-actions">
        <button id="btn-maps" class="pixel-btn accent-cyan" type="button" aria-label="Open Fishing Maps">MAP</button>
        <button id="btn-shop" class="pixel-btn accent-gold" type="button" aria-label="Open Tackle Shop">SHOP</button>
        <button id="btn-log" class="pixel-btn" type="button" aria-label="Open Fish Log">LOG</button>
        <button id="btn-admin" class="pixel-btn accent-purple" type="button" aria-label="Open Admin Test Panel" title="Admin Test Panel">DEV</button>
        <button id="btn-sound" class="pixel-btn icon-btn" type="button" aria-label="Toggle Sound" title="Toggle Sound">SFX</button>
      </div>
    </header>

    <!-- Current map & water zone indicator -->
    <div id="depth-badge" class="pixel-pill small-pill">SUNLIT PIER &bull; PIER</div>

    <!-- Context hint banner -->
    <div id="hint-banner" role="status" aria-live="polite">HOLD &amp; RELEASE TO CAST</div>

    <!-- Bottom mobile + desktop controls -->
    <footer id="hud-bottom">
      <div id="reel-panel" class="hidden" aria-label="Reeling meters">
        <div class="meter-row">
          <span class="meter-label">LINE</span>
          <div class="meter-track">
            <div id="tension-fill" class="meter-fill tension"></div>
            <div class="meter-danger-zone"></div>
          </div>
        </div>
        <div class="meter-row">
          <span class="meter-label">REEL</span>
          <div class="meter-track">
            <div id="progress-fill" class="meter-fill progress"></div>
          </div>
        </div>
      </div>

      <div id="control-row">
        <button id="action-btn" class="pixel-btn action-primary" type="button">HOLD TO CAST</button>
      </div>
    </footer>

    <!-- Catch celebration card -->
    <div id="catch-overlay" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="catch-title">
      <div class="pixel-panel catch-card">
        <div id="catch-rarity" class="rarity-tag">COMMON</div>
        <h2 id="catch-title">SILVER MINNOW</h2>
        <div class="catch-sprite-frame">
          <img id="catch-sprite" alt="Caught fish pixel sprite" />
        </div>
        <div class="catch-meta">
          <div class="meta-cell">
            <span class="meta-k">WEIGHT</span>
            <span id="catch-weight" class="meta-v">0.40 kg</span>
          </div>
          <div class="meta-cell">
            <span class="meta-k">VALUE</span>
            <span id="catch-value" class="meta-v gold">+14 G</span>
          </div>
          <div class="meta-cell">
            <span class="meta-k">RECORD</span>
            <span id="catch-record" class="meta-v">NEW!</span>
          </div>
        </div>
        <p id="catch-desc" class="catch-desc"></p>
        <button id="btn-catch-ok" class="pixel-btn action-primary full-w" type="button">KEEP &amp; CONTINUE</button>
      </div>
    </div>

    <!-- Fishing Maps modal -->
    <div id="maps-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="maps-title">
      <div class="pixel-panel modal-panel">
        <div class="modal-header">
          <h2 id="maps-title">FISHING MAPS</h2>
          <span class="modal-coins"><span class="coin-dot"></span><span id="maps-coins">0</span></span>
          <button id="btn-maps-close" class="pixel-btn close-btn" type="button" aria-label="Close Maps">X</button>
        </div>
        <div id="maps-list" class="modal-body"></div>
      </div>
    </div>

    <!-- Tackle Shop modal -->
    <div id="shop-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="shop-title">
      <div class="pixel-panel modal-panel">
        <div class="modal-header">
          <h2 id="shop-title">TACKLE SHOP</h2>
          <span class="modal-coins"><span class="coin-dot"></span><span id="shop-coins">0</span></span>
          <button id="btn-shop-close" class="pixel-btn close-btn" type="button" aria-label="Close Shop">X</button>
        </div>
        <div id="shop-list" class="modal-body"></div>
      </div>
    </div>

    <!-- Fish Log modal -->
    <div id="log-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="log-title">
      <div class="pixel-panel modal-panel">
        <div class="modal-header">
          <h2 id="log-title">FISH LOG</h2>
          <span id="log-count" class="modal-sub">0 / 20</span>
          <button id="btn-log-close" class="pixel-btn close-btn" type="button" aria-label="Close Fish Log">X</button>
        </div>
        <div id="log-grid" class="modal-body log-grid"></div>
      </div>
    </div>

    <!-- Admin / Dev Test Panel modal -->
    <div id="admin-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="admin-title">
      <div class="pixel-panel modal-panel">
        <div class="modal-header">
          <h2 id="admin-title">ADMIN TEST PANEL</h2>
          <span id="admin-status" class="modal-sub">DEV TOOLS</span>
          <button id="btn-admin-close" class="pixel-btn close-btn" type="button" aria-label="Close Admin Panel">X</button>
        </div>
        <div class="modal-body admin-body">
          <div class="admin-section">
            <div class="admin-label">GOLD &amp; PROGRESSION</div>
            <div class="admin-row">
              <button id="adm-gold-100" class="pixel-btn accent-gold" type="button">+100 G</button>
              <button id="adm-gold-1000" class="pixel-btn accent-gold" type="button">+1000 G</button>
              <button id="adm-unlock-maps" class="pixel-btn accent-cyan" type="button">ALL MAPS</button>
              <button id="adm-max-gear" class="pixel-btn accent-cyan" type="button">MAX GEAR</button>
              <button id="adm-fill-log" class="pixel-btn" type="button">FILL LOG</button>
              <button id="adm-reset" class="pixel-btn danger-btn" type="button">RESET SAVE</button>
            </div>
          </div>

          <div class="admin-section">
            <div class="admin-label">INSTANT MAP WARP</div>
            <div id="adm-map-row" class="admin-row"></div>
          </div>

          <div class="admin-section">
            <div class="admin-label">TIME OF DAY</div>
            <div class="admin-row">
              <button id="adm-tod-dawn" class="pixel-btn" type="button">DAWN</button>
              <button id="adm-tod-day" class="pixel-btn" type="button">DAY</button>
              <button id="adm-tod-sunset" class="pixel-btn" type="button">SUNSET</button>
              <button id="adm-tod-night" class="pixel-btn" type="button">NIGHT</button>
              <button id="adm-tod-freeze" class="pixel-btn" type="button">CLOCK: RUN</button>
            </div>
          </div>

          <div class="admin-section">
            <div class="admin-label">SPAWN &amp; BITE TESTER</div>
            <div class="admin-row">
              <select id="adm-fish-select" class="pixel-select" aria-label="Choose fish species"></select>
              <button id="adm-spawn-fish" class="pixel-btn" type="button">SPAWN</button>
              <button id="adm-force-bite" class="pixel-btn accent-purple" type="button">INSTANT BITE</button>
            </div>
          </div>

          <div class="admin-section">
            <div class="admin-label">REELING HELPERS</div>
            <div class="admin-row">
              <button id="adm-nosnap" class="pixel-btn" type="button">NO SNAP: OFF</button>
              <button id="adm-autoland" class="pixel-btn accent-cyan" type="button">AUTO-LAND ACTIVE</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
