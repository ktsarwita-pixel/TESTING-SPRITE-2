<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>PIXEL DASH</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07070d;
    font-family: 'Courier New', Courier, monospace;
    touch-action: none;
  }
  #game-wrapper {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #07070d;
  }
  canvas {
    display: block;
    width: 480px;
    height: 270px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    box-shadow: 0 0 0 4px #1f243d;
    background: #0d1021;
    touch-action: none;
    /* own compositing layer = no page repaints while the game runs */
    will-change: transform;
    transform: translateZ(0);
  }
  #hud-top {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 6px;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    z-index: 10;
  }
  .hud-group {
    display: flex;
    flex-shrink: 0;
    gap: 6px;
    pointer-events: auto;
  }
  .hud-btn {
    background: rgba(15, 18, 35, 0.88);
    border: 2px solid #fff;
    color: #fff;
    font-family: "Courier New", Courier, monospace;
    font-weight: bold;
    font-size: 12px;
    padding: 5px 8px;
    cursor: pointer;
    box-shadow: 2px 2px 0 #000;
    text-transform: uppercase;
  }
  .hud-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 0 0 0 #000;
  }
  #btn-menu, #btn-prac, #btn-bot, #btn-bstyle, #btn-cp, #btn-undo { display: none; }
  #btn-bstyle { border-color: #d946ef; color: #d946ef; }
  #btn-cp   { background: rgba(15, 45, 25, 0.9); border-color: #39ff14; color: #39ff14; }
  #btn-undo { background: rgba(45, 20, 15, 0.9); border-color: #ff9900; color: #ff9900; }
  @media (max-width: 600px) {
    #hud-top { top: 6px; left: 6px; right: 6px; }
    .hud-group { gap: 4px; }
    .hud-btn { font-size: 10px; padding: 4px 5px; border-width: 2px; }
  }
  @media (max-width: 380px) {
    .hud-btn { font-size: 9px; padding: 4px 3px; }
  }
</style>
</head>
<body>
<div id="game-wrapper">
  <canvas id="game" width="480" height="270"></canvas>
  <div id="hud-top">
    <div class="hud-group">
      <button id="btn-menu" class="hud-btn">MENU</button>
      <button id="btn-prac" class="hud-btn">PRAC: OFF</button>
      <button id="btn-bot" class="hud-btn">BOT: OFF</button>
      <button id="btn-bstyle" class="hud-btn">STYLE: LEAST</button>
    </div>
    <div class="hud-group">
      <button id="btn-cp" class="hud-btn">+ CP</button>
      <button id="btn-undo" class="hud-btn">- CP</button>
      <button id="btn-mute" class="hud-btn">SFX: ON</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';
  const canvas = document.getElementById('game');
  const wrapper = document.getElementById('game-wrapper');
  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.imageSmoothingEnabled = false;
  const btnMenu = document.getElementById('btn-menu');
  const btnPrac = document.getElementById('btn-prac');
  const btnBot = document.getElementById('btn-bot');
  const btnBStyle = document.getElementById('btn-bstyle');
  const btnCp = document.getElementById('btn-cp');
  const btnUndo = document.getElementById('btn-undo');
  const btnMute = document.getElementById('btn-mute');

  let practiceMode = false;
  let botMode = false;
  let botStyle = 'least'; // 'least' | 'spam'
  let botPlan = null;
  let botReferenceRetryFrame = 0;
  let cubeAfterWave = false;
  let checkpoints = []; // stack of position, mode, velocity and bot-handoff state

  const W = 480;
  const H = 270;
  const GROUND_Y = 224;
  const CEILING_Y = 18;
  const TILE = 16;
  const PLAYER_X = 80;
  const WALL_SCREEN_X = 392;     // where the finish wall sits once the camera stops
  const FONT_S = 'bold 9px Courier New';
  const FONT_M = 'bold 11px Courier New';

  // ---------- RESIZE (never collapses to a few pixels) ----------
  let lastCssW = 0, lastCssH = 0;
  function resize() {
    const ww = wrapper.clientWidth || window.innerWidth || document.documentElement.clientWidth;
    const wh = wrapper.clientHeight || window.innerHeight || document.documentElement.clientHeight;
    if (!ww || !wh) return;
    const scale = Math.max(0.5, Math.min(ww / W, wh / H));
    const cw = Math.floor(W * scale), ch = Math.floor(H * scale);
    if (cw === lastCssW && ch === lastCssH) return;   // avoid layout thrash
    lastCssW = cw; lastCssH = ch;
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 120));
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resize).observe(wrapper);
  resize();
  requestAnimationFrame(resize);

  // ---------- 8-BIT AUDIO (single master bus, scheduled notes, no setTimeout) ----------
  let audioCtx = null, master = null;
  let muted = false;
  let beatStep = 0;
  let lastBeatTime = 0;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        audioCtx = new AC();
        master = audioCtx.createGain();
        master.gain.value = 0.9;
        master.connect(audioCtx.destination);
      }
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playTone(freq, endFreq, dur, type = 'square', vol = 0.1, delay = 0) {
    if (muted || !audioCtx) return;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (endFreq !== freq) osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFreq), now + dur);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain);
    gain.connect(master);
    osc.start(now);
    osc.stop(now + dur + 0.02);
  }

  const sfx = {
    jump: () => playTone(260, 520, 0.08, 'square', 0.09),
    orb: () => playTone(440, 880, 0.1, 'triangle', 0.12),
    portal: () => {
      playTone(330, 660, 0.11, 'sawtooth', 0.08);
      playTone(520, 980, 0.12, 'square', 0.07, 0.05);
    },
    crash: () => {
      playTone(170, 40, 0.24, 'sawtooth', 0.16);
      playTone(100, 30, 0.26, 'square', 0.12);
    },
    whoosh: () => playTone(200, 1200, 0.35, 'sawtooth', 0.06),
    boom: () => {
      playTone(90, 30, 0.5, 'square', 0.16);
      playTone(1200, 200, 0.3, 'triangle', 0.08);
    },
    win: () => {
      [523, 659, 784, 1046, 1318].forEach((n, i) => playTone(n, n, 0.16, 'square', 0.1, 0.25 + i * 0.09));
      playTone(1046, 1046, 0.5, 'triangle', 0.1, 0.25 + 5 * 0.09);
    },
    click: () => playTone(600, 400, 0.05, 'square', 0.07)
  };

  function updateBeat() {
    if (muted || !audioCtx || state !== 'playing') return;
    const now = performance.now();
    const interval = 220 - currentLevelIdx * 25;
    if (now - lastBeatTime > interval) {
      lastBeatTime = now;
      const bass = [110, 110, 146.8, 130.8, 110, 110, 164.8, 146.8];
      const note = bass[beatStep % bass.length];
      playTone(note, note * 0.98, 0.09, 'triangle', 0.05);
      beatStep++;
    }
  }

  btnMute.addEventListener('click', (e) => {
    e.stopPropagation();
    muted = !muted;
    btnMute.textContent = muted ? 'SFX: OFF' : 'SFX: ON';
  });

  // ---------- LEVELS ----------
  function buildLevels() {
    // Wide blocks = one object per run instead of one per tile (much fewer checks/draws)
    const blocks = (x, y, count, h = 1) => [
      { type: 'block', x: x * TILE, y: GROUND_Y - y * TILE, w: count * TILE, h: h * TILE }
    ];
    const spike = (x, y = 1, dir = 'up') => ({
      type: 'spike', x: x * TILE, y: GROUND_Y - y * TILE, w: TILE, h: TILE, dir
    });
    const spikes = (x, count, y = 1, dir = 'up') => {
      const arr = [];
      for (let i = 0; i < count; i++) arr.push(spike(x + i, y, dir));
      return arr;
    };
    const portal = (x, mode) => ({
      type: 'portal', x: x * TILE, y: CEILING_Y, w: TILE, h: GROUND_Y - CEILING_Y, mode
    });
    const orb = (x, y) => ({
      type: 'orb', x: x * TILE, y: GROUND_Y - y * TILE, w: TILE, h: TILE, used: false
    });
    const pad = (x, y = 1) => ({
      type: 'pad', x: x * TILE, y: GROUND_Y - y * TILE, w: TILE, h: TILE
    });
    // Sealed to the ceiling: from CEILING_Y down to bottomTile
    const ceilBlock = (x, bottomTile, count) => {
      const h = (GROUND_Y - bottomTile * TILE) - CEILING_Y;
      if (h <= 0) return [];
      return [{ type: 'block', x: x * TILE, y: CEILING_Y, w: count * TILE, h }];
    };
    // Sealed to the ground: from topTile down to GROUND_Y
    const floorBlock = (x, topTile, count) => {
      if (topTile <= 0) return [];
      return [{ type: 'block', x: x * TILE, y: GROUND_Y - topTile * TILE, w: count * TILE, h: topTile * TILE }];
    };
    // Sealed corridor: segments of [length, floorTop, ceilBottom] (13 = no ceiling)
    const tunnel = (x, segs) => {
      const arr = [];
      let cx = x;
      for (const [len, f, c] of segs) {
        arr.push(...floorBlock(cx, f, len));
        if (c < 13) arr.push(...ceilBlock(cx, c, len));
        cx += len;
      }
      return arr;
    };

    // Tighten a wave corridor: keep the floor profile, set the ceiling so the gap is exactly g tiles
    const tight = (segs, g) => segs.map(([len, f]) => [len, f, f + g]);

    const lvl1 = [
      spike(14),
      ...spikes(23, 2),
      ...blocks(32, 1, 4),
      ...spikes(44, 2),
      spike(53),
      ...spikes(62, 5),
      orb(64, 3),
      pad(74, 1),
      portal(80, 'ship'),
      ...ceilBlock(88, 10, 4),
      ...floorBlock(96, 3, 4),
      ...ceilBlock(105, 9, 4),
      ...floorBlock(113, 3, 4),
      portal(122, 'wave'),
      ...ceilBlock(128, 10, 8),
      ...floorBlock(128, 2, 8),
      ...ceilBlock(140, 9, 6),
      ...floorBlock(140, 2, 6),
      ...ceilBlock(150, 10, 6),
      ...floorBlock(150, 3, 6),
      portal(160, 'cube'),
      ...spikes(167, 2),
      ...spikes(175, 2),
      ...spikes(183, 5),
      orb(185, 3),
      spike(194),
    ];

    // LEVEL 2 — CYBER WAVE: stair-climb, pad launch, weaving ship, zig-zag wave, platform finale
    const lvl2 = [
      // Cube: warm-up + floating staircase
      spike(10),
      ...spikes(16, 2),
      ...blocks(22, 1, 4),
      ...spikes(26, 2),
      ...blocks(28, 2, 4, 2),
      ...spikes(32, 2),
      ...blocks(34, 3, 4, 3),
      ...spikes(38, 3),
      pad(47),
      ...spikes(49, 4),
      ...spikes(59, 2),
      // Ship: weaving sealed corridor with hanging spikes
      portal(66, 'ship'),
      ...tunnel(72, [
        [4, 0, 8], [3, 0, 13], [4, 4, 13], [3, 0, 13],
        [5, 2, 8], [3, 0, 13], [4, 0, 6], [3, 0, 13],
        [4, 5, 13], [3, 0, 13], [4, 3, 9]
      ]),
      spike(73, 8, 'down'), spike(74, 8, 'down'),
      spike(80, 5), spike(81, 5),
      spike(96, 6, 'down'), spike(97, 6, 'down'),
      spike(103, 6), spike(104, 6),
      // Wave: smooth zig-zag tunnel
      portal(116, 'wave'),
      ...tunnel(120, [
        [3, 3, 9], [2, 4, 10], [2, 5, 11], [2, 6, 12], [2, 5, 11], [2, 4, 10],
        [2, 3, 9], [2, 2, 8], [2, 1, 7], [2, 2, 8], [2, 3, 9], [3, 0, 13],
        [2, 4, 10], [2, 6, 12], [2, 4, 10], [2, 2, 8], [2, 4, 10], [3, 3, 9]
      ]),
      // Cube finale: hop-on platforms + orb
      portal(162, 'cube'),
      ...spikes(168, 2),
      ...blocks(173, 1, 2),
      ...spikes(175, 2),
      ...blocks(177, 2, 2, 2),
      ...spikes(179, 2),
      ...spikes(186, 5),
      orb(188, 3),
      spike(197),
    ];

    // LEVEL 3 — PIXEL OVERDRIVE: orb chain, steep wave, spiked ship gauntlet, double-orb finale
    const lvl3 = [
      // Cube: fast opener
      ...spikes(9, 2),
      ...spikes(15, 3),
      ...blocks(23, 1, 4),
      ...spikes(27, 2),
      ...blocks(29, 2, 3, 2),
      ...spikes(32, 2),
      ...spikes(40, 7),
      orb(42, 3),
      pad(54),
      ...spikes(56, 5),
      ...spikes(65, 2),
      // Wave: steep then narrow
      portal(70, 'wave'),
      ...tunnel(74, [
        [3, 4, 10], [1, 5, 11], [1, 6, 12], [1, 5, 11], [1, 4, 10], [1, 3, 9],
        [1, 2, 8], [1, 1, 7], [1, 2, 8], [1, 3, 9], [1, 4, 10], [2, 4, 10],
        [2, 0, 13],
        [2, 3, 8], [2, 4, 9], [2, 5, 10], [2, 6, 11], [2, 5, 10], [2, 4, 9],
        [2, 3, 8], [2, 2, 7], [2, 1, 6], [2, 2, 7], [3, 3, 8]
      ]),
      // Ship: tight spiked gauntlet
      portal(120, 'ship'),
      ...tunnel(125, [
        [3, 0, 7], [2, 0, 13], [3, 4, 13], [2, 0, 13], [3, 1, 6],
        [2, 0, 13], [3, 2, 13], [2, 0, 13], [3, 0, 7], [2, 0, 13], [4, 3, 9]
      ]),
      spike(126, 7, 'down'), spike(127, 7, 'down'),
      spike(131, 5), spike(132, 5),
      spike(141, 3), spike(142, 3),
      spike(146, 7, 'down'), spike(147, 7, 'down'),
      // Cube finale: double orb + platforms
      portal(158, 'cube'),
      ...spikes(164, 3),
      ...blocks(170, 1, 2),
      ...spikes(172, 3),
      ...blocks(175, 2, 2, 2),
      ...spikes(182, 7),
      orb(184, 3),
      ...spikes(196, 2),
    ];

    const lvl4 = [
      ...spikes(8, 3),
      ...spikes(18, 2),
      ...blocks(24, 1, 4),
      ...spikes(31, 2),
      ...blocks(33, 2, 4, 2),
      ...spikes(40, 3),
      pad(48),
      ...spikes(50, 4),
      portal(60, 'wave'),
      ...tunnel(64, tight([
        [3, 4, 10], [3, 5, 11], [3, 6, 12], [3, 5, 11], [3, 4, 10], [3, 3, 9],
        [3, 2, 8], [3, 3, 9], [3, 4, 10]
      ], 4)),
      portal(93, 'ship'),
      ...tunnel(97, [
        [3, 0, 6], [2, 0, 11], [3, 4, 9], [2, 0, 11], [3, 1, 6],
        [2, 0, 11], [3, 3, 8]
      ]),
      spike(98, 6, 'down'),
      spike(103, 5),
      portal(118, 'cube'),
      ...spikes(124, 3),
      ...blocks(131, 1, 3),
      ...spikes(137, 2),
      ...spikes(143, 3)
    ];

    const lvl5 = [
      ...spikes(8, 3),
      ...spikes(18, 2),
      ...blocks(24, 1, 4),
      ...spikes(31, 2),
      ...blocks(33, 2, 4, 2),
      ...spikes(40, 3),
      pad(48),
      ...spikes(50, 4),
      portal(60, 'ship'),
      ...tunnel(64, [
        [3, 0, 6], [2, 0, 11], [3, 4, 9], [2, 0, 11], [3, 2, 7],
        [2, 0, 11], [3, 3, 8]
      ]),
      spike(65, 6, 'down'),
      spike(70, 5),
      portal(84, 'wave'),
      ...tunnel(88, tight([
        [3, 3, 9], [3, 4, 10], [3, 5, 11], [3, 4, 10], [3, 3, 9], [3, 2, 8],
        [3, 3, 9], [3, 4, 10]
      ], 4)),
      portal(114, 'cube'),
      ...spikes(120, 3),
      ...spikes(129, 3)
    ];

    return [
      {
        name: 'NEON GENESIS', diff: 'EASY', speed: 2.6,
        bg1: '#0f1638', bg2: '#1b2659', ground: '#161f47',
        accent: '#00f5d4', playerColor: '#00f5d4',
        length: 200 * TILE, objects: lvl1
      },
      {
        name: 'CYBER WAVE', diff: 'NORMAL', speed: 3.1,
        bg1: '#230b36', bg2: '#3c1361', ground: '#2b0d45',
        accent: '#ff2a85', playerColor: '#ffea00',
        length: 202 * TILE, objects: lvl2
      },
      {
        name: 'PIXEL OVERDRIVE', diff: 'HARD', speed: 3.55,
        bg1: '#2b0909', bg2: '#521111', ground: '#380b0b',
        accent: '#ff9900', playerColor: '#70ff00',
        length: 201 * TILE, objects: lvl3
      },
      {
        name: 'HYPER MATRIX', diff: 'INSANE', speed: 3.95,
        bg1: '#091f2c', bg2: '#113a52', ground: '#0c293a',
        accent: '#d946ef', playerColor: '#00f5d4',
        length: 149 * TILE, objects: lvl4
      },
      {
        name: 'OMEGA CORE', diff: 'INSANE', speed: 4.25,
        bg1: '#240512', bg2: '#4a0a24', ground: '#300718',
        accent: '#ff2244', playerColor: '#ffea00',
        length: 136 * TILE, objects: lvl5
      },
      {
        name: 'VOID RUNNER', diff: 'INSANE', speed: 4.2,
        bg1: '#0c1b33', bg2: '#16325c', ground: '#0f2240',
        accent: '#38bdf8', playerColor: '#38bdf8',
        length: 118 * TILE,
        objects: [
          ...spikes(8, 3), ...blocks(15, 1, 2), ...spikes(18, 2), pad(23), ...spikes(25, 4),
          portal(34, 'wave'),
          ...tunnel(38, tight([[3,4,10],[3,5,11],[3,6,12],[3,5,11],[3,4,10],[3,3,9],[3,2,8],[3,3,9],[3,4,10]], 4)),
          portal(68, 'ship'),
          ...tunnel(72, [[3,0,6],[2,0,11],[3,4,9],[2,0,11],[3,1,6],[2,0,11],[3,3,8]]),
          spike(73, 6, 'down'), spike(78, 5),
          portal(96, 'cube'), ...spikes(102, 3), ...spikes(110, 3)
        ]
      },
      {
        name: 'SOLAR FLARE', diff: 'INSANE', speed: 4.4,
        bg1: '#2e1005', bg2: '#5c200a', ground: '#3d1507',
        accent: '#fb923c', playerColor: '#facc15',
        length: 116 * TILE,
        objects: [
          ...spikes(8, 3), ...blocks(15, 1, 2), ...spikes(18, 3), pad(24), ...spikes(26, 4),
          portal(34, 'ship'),
          ...tunnel(38, [[3,0,6],[2,0,11],[3,4,9],[2,0,11],[3,2,7],[2,0,11],[3,3,8]]),
          spike(39, 6, 'down'), spike(44, 5),
          portal(62, 'wave'),
          ...tunnel(66, tight([[3,3,9],[3,4,10],[3,5,11],[3,4,10],[3,3,9],[3,2,8],[3,3,9],[3,4,10]], 4)),
          portal(94, 'cube'), ...spikes(100, 3), ...spikes(108, 3)
        ]
      },
      {
        name: 'ABYSSAL DEMON', diff: 'DEMON', speed: 4.75,
        bg1: '#1a0314', bg2: '#38062a', ground: '#24041c',
        accent: '#ff0055', playerColor: '#ff0055',
        length: 460 * TILE,
        objects: [
          ...spikes(8, 3), ...blocks(15, 1, 2), ...spikes(18, 3), pad(24), ...spikes(26, 4), ...spikes(39, 3),
          portal(42, 'wave'),
          ...tunnel(46, tight([[2,4,9],[2,5,10],[2,6,11],[2,5,10],[2,4,9],[2,3,8],[2,2,7],[2,1,6],[2,2,7],[2,3,8],[2,4,9],[2,5,10],[2,4,9],[2,3,8],[2,2,7],[2,3,8]], 3)),
          portal(82, 'ship'),
          ...tunnel(86, [[3,0,5],[2,0,10],[3,3,8],[2,0,10],[3,1,6],[2,0,10],[3,4,9],[2,0,10],[3,2,7],[2,0,10],[3,4,9]]),
          spike(87, 5, 'down'), spike(92, 4), spike(102, 5),
          portal(122, 'cube'),
          ...spikes(128, 3), ...blocks(135, 1, 2), ...spikes(138, 3), pad(144), ...spikes(146, 4), ...spikes(159, 3),
          portal(162, 'wave'),
          ...tunnel(166, tight([[2,3,8],[2,4,9],[2,5,10],[2,6,11],[2,5,10],[2,4,9],[2,3,8],[2,2,7],[2,3,8],[2,4,9],[2,5,10],[2,4,9],[2,3,8]], 3)),
          portal(198, 'ship'),
          ...tunnel(202, [[3,0,5],[2,0,10],[3,3,8],[2,0,10],[3,1,6],[2,0,10],[3,4,9],[2,0,10],[3,2,7]]),
          spike(203, 5, 'down'), spike(208, 4),
          portal(232, 'cube'),
          ...spikes(238, 3), ...blocks(245, 2, 2, 2), ...spikes(249, 3), ...spikes(258, 3),
          ...blocks(266, 1, 2), ...spikes(269, 3), pad(275), ...spikes(277, 4),
          portal(286, 'wave'),
          ...tunnel(290, tight([[2,4,9],[2,5,10],[2,6,11],[2,5,10],[2,4,9],[2,3,8],[2,2,7],[2,3,8],[2,4,9]], 3)),
          portal(314, 'ship'),
          ...tunnel(318, [[3,0,5],[2,0,10],[3,3,8],[2,0,10],[3,2,7],[2,0,10],[3,4,9]]),
          spike(319, 5, 'down'), spike(324, 4),
          portal(342, 'cube'),
          ...spikes(348, 3), ...spikes(359, 3), ...spikes(370, 3), ...blocks(378, 1, 2), ...spikes(381, 3),
          ...spikes(393, 3), ...spikes(405, 3), ...spikes(417, 3), ...spikes(429, 3), ...spikes(441, 3), ...spikes(451, 2)
        ]
      }
    ];
  }

  let levels = buildLevels();

  // Sort + index every level once: lets update/render skip straight to on-screen objects
  for (let levelIndex = 0; levelIndex < levels.length; levelIndex++) {
    const lvl = levels[levelIndex];
    lvl.objects.sort((a, b) => a.x - b.x);
    lvl.maxW = 0;
    lvl.orbs = [];
    lvl.strictWave = levelIndex > 0;
    for (const o of lvl.objects) {
      if (o.w > lvl.maxW) lvl.maxW = o.w;
      if (o.type === 'orb') {
        o.botBit = 1 << lvl.orbs.length;
        lvl.orbs.push(o);
      }
    }
    lvl.endX = lvl.length + WALL_SCREEN_X; // world X of the finish wall
    // animated pickups/portals (blocks & spikes go into the static cache instead)
    lvl.dynObjs = lvl.objects.filter(o => o.type === 'orb' || o.type === 'pad' || o.type === 'portal');
    lvl.staticC = null;
  }

  // ---------- STATIC LAYER CACHE ----------
  // Blocks and spikes never move: rasterise the whole level ONCE into an offscreen
  // canvas, then each frame is a single sliced drawImage instead of dozens of
  // per-object transforms / pattern fills. Only the current level is kept cached.
  function buildStaticCache(lvl) {
    if (lvl.staticC) return;
    const w = Math.ceil(lvl.endX + W + 96), h = H;
    const [c, g] = makeCanvas(w, h);
    const pat = lvl.gfx.blockPattern, accent = lvl.accent;
    for (const o of lvl.objects) {
      if (o.type === 'block') {
        g.save();
        g.translate(o.x, o.y);                       // keep the tile pattern aligned to the block
        g.fillStyle = pat;
        g.fillRect(0, 0, o.w, o.h);
        g.restore();
        g.fillStyle = accent;                         // neon edges
        g.fillRect(o.x, o.y, o.w, 2);
        g.fillRect(o.x, o.y + o.h - 2, o.w, 2);
        g.fillRect(o.x, o.y, 2, o.h);
        g.fillRect(o.x + o.w - 2, o.y, 2, o.h);
        g.fillStyle = 'rgba(0,0,0,0.6)';              // outer outline
        g.fillRect(o.x, o.y, o.w, 1); g.fillRect(o.x, o.y + o.h - 1, o.w, 1);
        g.fillRect(o.x, o.y, 1, o.h); g.fillRect(o.x + o.w - 1, o.y, 1, o.h);
      } else if (o.type === 'spike') {
        g.drawImage(o.dir === 'down' ? SPR_SPIKE_DOWN : SPR_SPIKE_UP, o.x, o.y);
      }
    }
    lvl.staticC = c;
  }

  function firstIndex(objs, minX) {
    let lo = 0, hi = objs.length;
    while (lo < hi) {
      const mid = (lo + hi) >> 1;
      if (objs[mid].x < minX) lo = mid + 1; else hi = mid;
    }
    return lo;
  }

  // ---------- PRE-RENDERED SPRITES (drawImage is far cheaper than paths every frame) ----------
  function makeCanvas(w, h) {
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    return [c, g];
  }

  // Chunky pixel-art spike: dark outline, red body, shaded right flank, lit left edge, white tip.
  function spikeSprite(down) {
    const [c, g] = makeCanvas(TILE, TILE);
    for (let i = 0; i < 16; i++) {
      const row = down ? 15 - i : i;
      const half = Math.round((i + 1) * 0.5);              // 1..8 px half-width, tip row first
      const x0 = 8 - half, w = half * 2;
      g.fillStyle = '#ff3355'; g.fillRect(x0, row, w, 1);  // body
      g.fillStyle = '#c81e3f';                             // right flank shade
      g.fillRect(8 + (half >> 1), row, half - (half >> 1), 1);
      g.fillStyle = '#ff9db1'; g.fillRect(x0 + 1, row, 2, 1); // left highlight
      g.fillStyle = '#4a0a18';                             // outline
      g.fillRect(x0, row, 1, 1); g.fillRect(x0 + w - 1, row, 1, 1);
    }
    g.fillStyle = '#fff'; g.fillRect(7, down ? 15 : 0, 2, 1); // bright tip
    return c;
  }
  const SPR_SPIKE_UP = spikeSprite(false);
  const SPR_SPIKE_DOWN = spikeSprite(true);

  // Jump orbs: 3-frame pulse + greyed-out "used" variant.
  function orbSprite(frame) {
    const [c, g] = makeCanvas(TILE, TILE);
    g.globalAlpha = [0.22, 0.38, 0.28][frame];
    g.fillStyle = '#ffea00'; g.fillRect(0, 0, TILE, TILE);   // blocky halo
    g.globalAlpha = 1;
    g.fillStyle = '#fff'; g.fillRect(2, 2, 12, 12);
    g.fillStyle = '#ffea00'; g.fillRect(4, 4, 8, 8);
    g.fillStyle = '#c9a800'; g.fillRect(4, 10, 8, 2); g.fillRect(10, 4, 2, 8); // inner shade
    g.fillStyle = '#fff8a0'; g.fillRect(5, 5, 3, 3);         // glint
    return c;
  }
  const SPR_ORB = [0, 1, 2].map(orbSprite);
  const SPR_ORB_USED = (() => {
    const [c, g] = makeCanvas(TILE, TILE);
    g.fillStyle = '#555'; g.fillRect(2, 2, 12, 12);
    g.fillStyle = '#333'; g.fillRect(4, 4, 8, 8);
    g.fillStyle = '#777'; g.fillRect(5, 5, 2, 2);
    return c;
  })();

  // Jump pads: 2-frame arrow pulse.
  function padSprite(frame) {
    const [c, g] = makeCanvas(TILE, TILE);
    g.fillStyle = '#3d0a22'; g.fillRect(0, 13, 16, 3);      // ground shadow
    g.fillStyle = '#ff2a85'; g.fillRect(1, 11, 14, 3);       // pad body
    g.fillStyle = '#ff7ab8'; g.fillRect(1, 11, 14, 1);       // top light
    g.fillStyle = '#000'; g.fillRect(1, 10, 14, 1);
    g.fillStyle = '#fff';                                    // arrow (sinks when pulsing)
    const ay = frame === 0 ? 1 : 3;
    g.fillRect(7, ay + 1, 2, 1); g.fillRect(6, ay + 2, 4, 1);
    g.fillRect(5, ay + 3, 6, 1); g.fillRect(4, ay + 4, 8, 2);
    return c;
  }
  const SPR_PAD = [0, 1].map(padSprite);

  // Portals: 4-frame flowing chevrons inside a glowing column.
  const PORTAL_COLORS = { ship: '#ff2a85', wave: '#00e5ff', cube: '#70ff00' };
  const SPR_PORTAL = {};
  for (const mode in PORTAL_COLORS) {
    const col = PORTAL_COLORS[mode];
    const ph = GROUND_Y - CEILING_Y;
    SPR_PORTAL[mode] = [];
    for (let f = 0; f < 4; f++) {
      const [c, g] = makeCanvas(TILE + 8, ph);
      g.globalAlpha = 0.16; g.fillStyle = col; g.fillRect(0, 0, TILE + 8, ph); // wash
      g.globalAlpha = 0.32; g.fillRect(3, 0, TILE + 2, ph);                    // inner field
      g.globalAlpha = 0.9; g.fillStyle = '#fff';                                // chevrons
      for (let y = -10 + f * 5; y < ph + 10; y += 20) {
        g.fillRect(10, y, 4, 3); g.fillRect(8, y + 3, 8, 2); g.fillRect(10, y + 5, 4, 3);
      }
      g.globalAlpha = 1; g.fillStyle = col;                                     // solid edges
      g.fillRect(0, 0, 4, ph); g.fillRect(TILE + 4, 0, 4, ph);
      g.fillStyle = '#fff'; g.fillRect(1, 0, 1, ph); g.fillRect(TILE + 5, 0, 1, ph);
      SPR_PORTAL[mode].push(c);
    }
  }

  // Approach chevrons strip for the finish wall (one drawImage instead of 60 rects).
  const SPR_CHEV = (() => {
    const ph = GROUND_Y - CEILING_Y;
    const [c, g] = makeCanvas(W + 68, ph);
    g.fillStyle = '#fff';
    for (let x = 0; x < W + 68; x += 34) {
      g.fillRect(x, ph - 10, 4, 2); g.fillRect(x + 2, ph - 8, 4, 2); g.fillRect(x + 4, ph - 6, 4, 2);
      g.fillRect(x + 2, ph - 4, 4, 2); g.fillRect(x, ph - 2, 4, 2);
      g.fillRect(x, 2, 4, 2); g.fillRect(x + 2, 4, 4, 2); g.fillRect(x + 4, 6, 4, 2);
      g.fillRect(x + 2, 8, 4, 2); g.fillRect(x, 10, 4, 2);
    }
    return c;
  })();

  // Checker pattern for the finish wall.
  const WALL_PAT = (() => {
    const [c, g] = makeCanvas(16, 16);
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, 8, 8); g.fillRect(8, 8, 8, 8);
    g.fillStyle = '#11131f'; g.fillRect(8, 0, 8, 8); g.fillRect(0, 8, 8, 8);
    return ctx.createPattern(c, 'repeat');
  })();

  // Practice checkpoint flag.
  const SPR_CP = (() => {
    const [c, g] = makeCanvas(12, 14);
    g.fillStyle = '#000'; g.fillRect(0, 0, 3, 14);
    g.fillStyle = '#39ff14'; g.fillRect(1, 1, 2, 12);
    g.fillStyle = '#000'; g.fillRect(3, 1, 9, 8);
    g.fillStyle = '#39ff14'; g.fillRect(4, 2, 7, 6);
    g.fillStyle = '#b4ff9f'; g.fillRect(5, 3, 2, 2);
    return c;
  })();

  function buildLevelGfx(lvl) {
    lvl.objects.sort((a, b) => a.x - b.x);
    // background (parallax columns + stars), 64px-periodic → draw a W+64 strip and slide it
    const [bg, bgg] = makeCanvas(W + 64, H);
    bgg.fillStyle = lvl.bg1; bgg.fillRect(0, 0, W + 64, H);
    bgg.fillStyle = lvl.bg2;
    for (let x = 0; x < W + 64; x += 64) {
      bgg.fillRect(x, 30, 24, GROUND_Y - 30);
      bgg.fillRect(x + 32, 70, 16, GROUND_Y - 70);
    }
    bgg.fillStyle = 'rgba(255,255,255,0.08)';
    for (let x = 0; x < W + 64; x += 64) {
      for (let y = 38; y < GROUND_Y; y += 14) bgg.fillRect(x + 6, y, 4, 4);
    }
    // star layers (480-periodic, two depths)
    const [st, stg] = makeCanvas(W * 2, GROUND_Y);
    stg.fillStyle = 'rgba(255,255,255,0.28)';
    for (let i = 0; i < 40; i++) {
      const sx = (i * 73) % W;
      const sy = 24 + ((i * 37) % (GROUND_Y - 50));
      stg.fillRect(sx, sy, 2, 2);
      stg.fillRect(sx + W, sy, 2, 2);
    }
    stg.fillStyle = 'rgba(255,255,255,0.14)';
    for (let i = 0; i < 26; i++) {
      const sx = (i * 131 + 40) % W;
      const sy = 18 + ((i * 53) % (GROUND_Y - 40));
      stg.fillRect(sx, sy, 1, 1);
      stg.fillRect(sx + W, sy, 1, 1);
    }
    // far skyline (128-periodic, slowest parallax)
    const [far, farg] = makeCanvas(W + 128, GROUND_Y);
    for (let x = 0; x < W + 128; x += 128) {
      const h1 = 46 + ((x * 7) % 62);
      farg.fillStyle = 'rgba(0,0,0,0.38)';
      farg.fillRect(x + 6, GROUND_Y - h1, 42, h1);
      farg.fillRect(x + 58, GROUND_Y - h1 + 28, 32, h1 - 28);
      farg.fillStyle = 'rgba(255,255,255,0.09)';
      for (let wy = GROUND_Y - h1 + 6; wy < GROUND_Y - 8; wy += 11) {
        farg.fillRect(x + 13, wy, 4, 4);
        farg.fillRect(x + 66, wy + 5, 3, 3);
      }
    }
    // ground + ceiling strip (TILE-periodic)
    const [gr, grg] = makeCanvas(W + TILE, H);
    grg.fillStyle = lvl.ground;
    grg.fillRect(0, 0, W + TILE, CEILING_Y);
    grg.fillRect(0, GROUND_Y, W + TILE, H - GROUND_Y);
    grg.fillStyle = lvl.accent;
    grg.fillRect(0, CEILING_Y - 2, W + TILE, 2);
    grg.fillRect(0, GROUND_Y, W + TILE, 2);
    grg.fillStyle = 'rgba(255,255,255,0.08)';
    for (let x = 0; x < W + TILE; x += TILE) {
      grg.fillRect(x, GROUND_Y + 4, 2, H - GROUND_Y - 4);
      grg.fillRect(x, GROUND_Y + 18, TILE - 2, 2);
      grg.fillRect(x, 4, 2, CEILING_Y - 8);
    }
    // block tile pattern: bevelled metal plate with accent rivet
    const [bt, btg] = makeCanvas(TILE, TILE);
    btg.fillStyle = '#171d3a'; btg.fillRect(0, 0, TILE, TILE);
    btg.fillStyle = 'rgba(255,255,255,0.14)'; btg.fillRect(0, 0, TILE, 2); btg.fillRect(0, 0, 2, TILE);
    btg.fillStyle = 'rgba(0,0,0,0.45)'; btg.fillRect(0, TILE - 2, TILE, 2); btg.fillRect(TILE - 2, 0, 2, TILE);
    btg.fillStyle = '#10142a'; btg.fillRect(3, 3, 10, 10);
    btg.fillStyle = 'rgba(255,255,255,0.09)'; btg.fillRect(4, 4, 8, 2); btg.fillRect(4, 4, 2, 8);
    btg.fillStyle = 'rgba(0,0,0,0.5)'; btg.fillRect(4, 10, 8, 2); btg.fillRect(10, 4, 2, 8);
    btg.globalAlpha = 0.55; btg.fillStyle = lvl.accent; btg.fillRect(7, 7, 2, 2);
    btg.globalAlpha = 1;
    const blockPattern = ctx.createPattern(bt, 'repeat');

    // player sprites
    const cube = (() => {
      const [c, g] = makeCanvas(14, 14);
      g.fillStyle = '#000'; g.fillRect(0, 0, 14, 14);
      g.fillStyle = lvl.playerColor; g.fillRect(1, 1, 12, 12);
      g.fillStyle = 'rgba(0,0,0,0.28)'; g.fillRect(1, 10, 12, 3); g.fillRect(10, 1, 3, 12); // shade
      g.fillStyle = 'rgba(255,255,255,0.55)'; g.fillRect(2, 2, 5, 1); g.fillRect(2, 3, 1, 3);  // shine
      g.fillStyle = '#000';
      g.fillRect(4, 4, 2, 3); g.fillRect(9, 4, 2, 3);                       // eyes
      g.fillStyle = '#fff'; g.fillRect(4, 4, 1, 1); g.fillRect(9, 4, 1, 1); // eye glints
      g.fillStyle = '#000';                                                 // smile
      g.fillRect(4, 9, 7, 2); g.fillRect(3, 8, 1, 2); g.fillRect(11, 8, 1, 2);
      return c;
    })();
    // ship: 2 frames (flame flicker)
    const ship = [0, 1].map((f) => {
      const [c, g] = makeCanvas(20, 14);
      g.fillStyle = '#000'; g.fillRect(1, 3, 18, 9);
      g.fillStyle = lvl.playerColor; g.fillRect(2, 4, 16, 7);               // hull
      g.fillStyle = 'rgba(0,0,0,0.25)'; g.fillRect(2, 9, 16, 2);
      g.fillStyle = lvl.playerColor; g.fillRect(6, 0, 9, 5);                // canopy hump
      g.fillStyle = '#000'; g.fillRect(7, 1, 7, 3);
      g.fillStyle = '#bfefff'; g.fillRect(8, 1, 4, 2);                      // cockpit glass
      g.fillStyle = '#fff'; g.fillRect(8, 1, 1, 1);
      g.fillStyle = 'rgba(255,255,255,0.5)'; g.fillRect(3, 5, 6, 1);        // hull shine
      if (f === 0) { g.fillStyle = '#ff9900'; g.fillRect(0, 6, 2, 3); g.fillStyle = '#ffea00'; g.fillRect(0, 7, 1, 1); }
      else { g.fillStyle = '#ff9900'; g.fillRect(0, 7, 1, 1); g.fillStyle = '#ffea00'; g.fillRect(1, 6, 1, 2); }
      return c;
    });
    // wave: pixel dart with outline, lit top edge and white tip
    const wave = (() => {
      const [c, g] = makeCanvas(10, 8);
      g.fillStyle = '#000';
      g.beginPath(); g.moveTo(0, 0); g.lineTo(10, 4); g.lineTo(0, 8); g.closePath(); g.fill();
      g.fillStyle = lvl.playerColor;
      g.beginPath(); g.moveTo(1, 1); g.lineTo(9, 4); g.lineTo(1, 7); g.closePath(); g.fill();
      return c;
    })();
    // soft glow sprite for the finish wall
    const [glow, gg] = makeCanvas(96, GROUND_Y - CEILING_Y);
    const grad = gg.createLinearGradient(0, 0, 96, 0);
    grad.addColorStop(0, 'rgba(255,255,255,0)');
    grad.addColorStop(1, lvl.accent);
    gg.globalAlpha = 0.55; gg.fillStyle = grad; gg.fillRect(0, 0, 96, GROUND_Y - CEILING_Y);

    lvl.gfx = { bg, st, far, gr, blockPattern, cube, ship, wave, glow };
  }
  levels.forEach(buildLevelGfx);

  // ---------- STATE ----------
  let currentLevelIdx = 0;
  let state = 'menu';          // menu | playing | dead | ending | win
  let bestProgress = [0, 0, 0, 0, 0, 0, 0, 0];
  let menuTab = 0;

  const player = {
    x: PLAYER_X, y: GROUND_Y - 14, w: 14, h: 14,
    vy: 0, rot: 0, mode: 'cube', onGround: false
  };

  // wave trail ring buffer (no array shifting / GC)
  const TRAIL_MAX = 30;
  const trailX = new Float32Array(TRAIL_MAX);
  const trailY = new Float32Array(TRAIL_MAX);
  let trailHead = 0, trailLen = 0;

  let cameraX = 0;
  let holding = false;
  let jumpPressed = false;
  let deadTimer = 0;
  let shakeTimer = 0;
  let modeBanner = '';
  let modeBannerTimer = 0;
  let attempts = 1;
  let frameCount = 0;

  // ending sequence
  let endTimer = 0;
  let flash = 0;
  let ringR = 0;
  let impactDone = false;
  let wallPulse = 0;
  let winTimer = 0;

  // interpolation
  let prevCamX = 0, prevPY = GROUND_Y - 14, prevRot = 0, prevPX = PLAYER_X;
  let viewCamX = 0, viewPY = GROUND_Y - 14, viewRot = 0, viewPX = PLAYER_X;

  // ---------- PARTICLE POOL (fixed size, zero allocation during play) ----------
  const P_MAX = 160;
  const pX = new Float32Array(P_MAX), pY = new Float32Array(P_MAX);
  const pVX = new Float32Array(P_MAX), pVY = new Float32Array(P_MAX);
  const pLife = new Float32Array(P_MAX), pSize = new Uint8Array(P_MAX);
  const pGrav = new Float32Array(P_MAX);
  const pColor = new Array(P_MAX).fill('#fff');
  let pCount = 0;

  function emit(x, y, vx, vy, life, size, color, grav = 0.12) {
    if (pCount >= P_MAX) return;
    const i = pCount++;
    pX[i] = x; pY[i] = y; pVX[i] = vx; pVY[i] = vy;
    pLife[i] = life; pSize[i] = size; pColor[i] = color; pGrav[i] = grav;
  }
  function spawnParticles(x, y, color, count = 14) {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * 6.2832;
      const spd = 1 + Math.random() * 3.5;
      emit(x, y, Math.cos(ang) * spd, Math.sin(ang) * spd - 1, 18 + Math.random() * 20,
        2 + ((Math.random() * 3) | 0), color);
    }
  }
  function updateParticles() {
    let i = 0;
    while (i < pCount) {
      pX[i] += pVX[i]; pY[i] += pVY[i]; pVY[i] += pGrav[i];
      if (--pLife[i] <= 0) {
        const j = --pCount;           // swap-remove, O(1)
        pX[i] = pX[j]; pY[i] = pY[j]; pVX[i] = pVX[j]; pVY[i] = pVY[j];
        pLife[i] = pLife[j]; pSize[i] = pSize[j]; pColor[i] = pColor[j]; pGrav[i] = pGrav[j];
      } else i++;
    }
  }
  function drawParticles(offX) {
    let lastCol = null;
    for (let i = 0; i < pCount; i++) {
      const c = pColor[i];
      if (c !== lastCol) { ctx.fillStyle = c; lastCol = c; }
      ctx.fillRect((pX[i] - offX) | 0, pY[i] | 0, pSize[i], pSize[i]);
    }
  }

  function saveCheckpoint() {
    if (!practiceMode || state !== 'playing') return;
    checkpoints.push({
      cameraX,
      y: player.y,
      vy: player.vy,
      mode: player.mode,
      rot: player.rot,
      onGround: player.onGround,
      cubeAfterWave
    });
    spawnParticles(cameraX + player.x + 7, player.y + 7, '#39ff14', 10, 0);
  }

  function undoCheckpoint() {
    if (!practiceMode || state !== 'playing' || checkpoints.length === 0) return;
    checkpoints.pop();
    sfx.click();
  }

  btnPrac.addEventListener('click', (e) => {
    e.stopPropagation();
    practiceMode = !practiceMode;
    btnPrac.textContent = practiceMode ? 'PRAC: ON' : 'PRAC: OFF';
    btnPrac.style.borderColor = practiceMode ? '#39ff14' : '#fff';
    btnPrac.style.color = practiceMode ? '#39ff14' : '#fff';
    const show = (practiceMode && state !== 'menu') ? 'block' : 'none';
    btnCp.style.display = show;
    btnUndo.style.display = show;
    if (!practiceMode) checkpoints = [];
  });

  btnBot.addEventListener('click', (e) => {
    e.stopPropagation();
    botMode = !botMode;
    btnBot.textContent = botMode ? 'BOT: ON' : 'BOT: OFF';
    btnBot.style.borderColor = botMode ? '#00e5ff' : '#fff';
    btnBot.style.color = botMode ? '#00e5ff' : '#fff';
    btnBStyle.style.display = (botMode && state !== 'menu') ? 'block' : 'none';
    botPlan = null;
    botReferenceRetryFrame = 0;
    if (!botMode) { holding = false; jumpPressed = false; }
  });

  btnBStyle.addEventListener('click', (e) => {
    e.stopPropagation();
    botStyle = botStyle === 'least' ? 'spam' : 'least';
    btnBStyle.textContent = botStyle === 'least' ? 'STYLE: LEAST' : 'STYLE: SPAM';
    sfx.click();
  });

  btnCp.addEventListener('click', (e) => {
    e.stopPropagation();
    saveCheckpoint();
  });

  btnUndo.addEventListener('click', (e) => {
    e.stopPropagation();
    undoCheckpoint();
  });

  // ---------- FLOW ----------
  function goMenu() {
    state = 'menu';
    btnMenu.style.display = 'none';
    btnPrac.style.display = 'none';
    btnBot.style.display = 'none';
    btnBStyle.style.display = 'none';
    btnCp.style.display = 'none';
    btnUndo.style.display = 'none';
    checkpoints = [];
    menuDirty = true;
  }

  function startLevel(idx) {
    currentLevelIdx = idx;
    checkpoints = [];
    for (const L of levels) if (L !== levels[idx]) L.staticC = null; // bound memory: one cache at a time
    buildStaticCache(levels[idx]);
    resetRun();
    state = 'playing';
    btnMenu.style.display = 'block';
    btnPrac.style.display = 'block';
    btnBot.style.display = 'block';
    btnBStyle.style.display = 'block';
    const showCp = practiceMode ? 'block' : 'none';
    btnCp.style.display = showCp;
    btnUndo.style.display = showCp;
  }

  function resetRun() {
    const lvl = levels[currentLevelIdx];
    botPlan = null;
    botReferenceRetryFrame = 0;
    cubeAfterWave = false;
    for (const o of lvl.orbs) o.used = false;
    player.x = PLAYER_X;
    if (practiceMode && checkpoints.length > 0) {
      const cp = checkpoints[checkpoints.length - 1];
      cameraX = cp.cameraX;
      player.y = cp.y;
      player.vy = cp.vy;
      player.mode = cp.mode;
      player.rot = cp.rot;
      player.onGround = cp.onGround;
      cubeAfterWave = !!cp.cubeAfterWave;
    } else {
      player.y = GROUND_Y - player.h;
      player.vy = 0; player.rot = 0;
      player.mode = 'cube';
      player.onGround = true;
      cameraX = 0;
    }
    trailHead = 0; trailLen = 0;
    pCount = 0;
    modeBanner = ''; modeBannerTimer = 0;
    endTimer = 0; flash = 0; ringR = 0; impactDone = false; winTimer = 0;
    prevCamX = viewCamX = cameraX;
    prevPY = viewPY = player.y;
    prevRot = viewRot = 0;
    prevPX = viewPX = PLAYER_X;
    hudKey = '';
  }

  // ---------- INPUT ----------
  function onPressStart(e) {
    if (e.target && e.target.tagName === 'BUTTON') return;
    ensureAudio();
    if (state === 'menu') { handleMenuTap(e); return; }
    if (state === 'win') {
      if (winTimer > 30) { sfx.click(); goMenu(); }
      return;
    }
    if (!holding) jumpPressed = true;
    holding = true;
  }
  function onPressEnd() { holding = false; }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (e.repeat) return;
      ensureAudio();
      if (state === 'playing' || state === 'dead') {
        if (!holding) jumpPressed = true;
        holding = true;
      } else if (state === 'win' && winTimer > 30) {
        goMenu();
      }
    } else if (e.code === 'Escape' && state !== 'menu') {
      goMenu();
    } else if (state === 'menu' && (e.code === 'Digit1' || e.code === 'Digit2' || e.code === 'Digit3')) {
      ensureAudio(); attempts = 1; startLevel(+e.code.slice(5) - 1);
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') holding = false;
  });
  window.addEventListener('pointerdown', (e) => {
    if (e.target && e.target.tagName === 'BUTTON') return;
    e.preventDefault();
    onPressStart(e);
  });
  window.addEventListener('pointerup', onPressEnd);
  window.addEventListener('pointercancel', onPressEnd);
  window.addEventListener('blur', onPressEnd);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  btnMenu.addEventListener('click', (e) => { e.stopPropagation(); sfx.click(); goMenu(); });

  function handleMenuTap(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = ((e.clientX - rect.left) / rect.width) * W;
    const cy = ((e.clientY - rect.top) / rect.height) * H;
    // Tab buttons: MAIN (150..236, 72..88) | EXTRA (244..330, 72..88)
    if (cy >= 70 && cy <= 88) {
      if (cx >= 150 && cx <= 236) { menuTab = 0; menuDirty = true; sfx.click(); return; }
      if (cx >= 244 && cx <= 330) { menuTab = 1; menuDirty = true; sfx.click(); return; }
    }
    if (menuTab === 0) {
      for (let i = 0; i < 5; i++) {
        const bx = 16 + i * 91, by = 96, bw = 84, bh = 126;
        if (cx >= bx && cx <= bx + bw && cy >= by && cy <= by + bh) {
          sfx.click(); attempts = 1; startLevel(i); return;
        }
      }
    } else {
      for (let k = 0; k < 3; k++) {
        const i = 5 + k;
        const bx = 42 + k * 136, by = 96, bw = 124, bh = 126;
        if (cx >= bx && cx <= bx + bw && cy >= by && cy <= by + bh) {
          sfx.click(); attempts = 1; startLevel(i); return;
        }
      }
    }
  }

  // ---------- BOT ----------
  // These compact routes were searched offline against the actual collision rules.
  // They are references, not forced inputs: an adaptive planner takes over whenever
  // the player starts the bot mid-run, resumes a checkpoint, or deviates from one.
  const TRAINED_BOT_ROUTES = [
    'AAAAgAAAAAAAAAAQAAAAABAAAAAAAAAAAAAAIAAAAAAAQAAAAAAAAAAAAAHw/wMAAAABAAAAAAAQAAA8+MCDh+NwODwch8Mx4xjH4TgcBw/H4eFwHI5jeDj+/wcAAPj//x8AAID//wcAgP///wAA/P8fAAAAAAAAAAAEAAAAAAAIAAAAAAAAAALw/wcAACAAAAAAAAAAAAAAAA==',
    'AQAAABAAAAAQAAAAAgAAQAAAAAAAAAAAAAAQAAAAAAAEAAAAAAAEAwB48ODDD/BwcADA/8GHYwD+g///fwAAHAM+x3E4Dof/BwCA/z/8/wDABwD4AHzw/wH4/78eAgBeHz4AAAAAIAAAAAAIAAAAAAAAAAAB/D8AAAAIAAAAAAAAAAA=',
    'AQAAAAEAAAABAAAAAgAAAAAAAAH+DwAAAAAAAQAAAABAAAAA/P//+f8BAAD/5z8A8PXr11GgQAUJwtv3wf8HAPj/cfj/AQAAgP//DwAHD49/AA8AAAgAAIAAAAAACAAAAAAAAf4PAAAAAgAAAAAAAAAA',
    'AQAAAAAgAAAAAAIAAAAgAAAAAAAAAQAAAAAI4P9f1V3dVUQFVVAFqnt1VzX4//8/AAAA/48fAAAAAAAgAAAAIAAAAAABAAAAAAAAAA==',
    'AQAAAAABAAAABAAAAAgAAAAAAAQAAAAAgAAA8P4DAAD/GMc45h+Aqru6K6iIiqi7uqvCAAAAAAABAAAAAAAAAA==',
    'QAAAACAAAAAAAAAAAPD/V3VXdwVVUBEVUX11V/Xh/x/7DwAA/g8PjnH8/wAAAAAgAAAAAAAAAAAA',
    'IAAAAEAAAAAAAAAAgP///wAAeByHMzwcjvkBrOqrW4WKqKC6664K4AEAAAAgAAAAAAAAAAA=',
    'BAAAgAAAAAAAAAAAABAA4P919yJBRCj4end3EBG69Q/8//8BIPD/DwAA//8HAODh/QAAAAAQAAAAEAAAAAAAAAFA8F933y4EBYne10dE9P8A/P//AQD8/g8AAPA/MAAAABAAAEAAAAAAAAEAACAAAAAAAAAAAPB/3b1IEAm6d/U/gP9/zIPDMf8PABzOHwAAAAACAAAABAAAAAABAAAAAgAAAAIAAAACAAAACAAAACAAAABAAAAAAAEAAAAAAAAAAAA='
  ];

  function decodeBotRoute(data, frames) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
    const bytes = [];
    let bits = 0, count = 0;
    for (const c of data) {
      if (c === '=') break;
      bits = (bits << 6) | chars.indexOf(c);
      count += 6;
      if (count >= 8) {
        count -= 8;
        bytes.push((bits >> count) & 255);
        bits &= (1 << count) - 1;
      }
    }
    const actions = new Uint8Array(frames);
    for (let i = 0; i < frames; i++) actions[i] = (bytes[i >> 3] >> (i & 7)) & 1;
    return actions;
  }

  function botNearby(lvl, px) {
    const result = [], objs = lvl.objects;
    const start = firstIndex(objs, px - lvl.maxW - 8);
    for (let k = start; k < objs.length; k++) {
      const o = objs[k];
      if (o.x > px + player.w + 8) break;
      if (o.x + o.w >= px - 8) result.push(o);
    }
    return result;
  }

  // One prediction is one REAL update tick. Physics runs in the old mode first;
  // then collisions switch the mode. In particular, the ship keeps its incoming
  // vertical velocity and must be free to release thrust on the following tick.
  function botStep(lvl, s, press, px, nearby) {
    const pw = player.w, ph = player.h;
    let y = s.y, vy = s.vy, grounded = s.grounded, mode = s.mode, mask = s.mask;
    if (mode === 'cube') {
      if (press && grounded) { vy = -5.6; grounded = false; }
      vy += 0.34;
      if (vy > 7) vy = 7;
      y += vy;
    } else if (mode === 'ship') {
      vy += press ? -0.28 : 0.24;
      vy = Math.max(-4, Math.min(4, vy));
      y += vy;
    } else {
      vy = (press ? -1 : 1) * lvl.speed * 0.95;
      y += vy;
    }

    grounded = false;
    if (y + ph >= GROUND_Y) {
      if (mode === 'wave' && lvl.strictWave) return null;
      y = GROUND_Y - ph; vy = 0; grounded = true;
    }
    if (y <= CEILING_Y) {
      if (mode === 'wave' && lvl.strictWave) return null;
      y = CEILING_Y; vy = 0;
    }

    let clearance = Math.min(y - CEILING_Y, GROUND_Y - ph - y);
    const objects = nearby || botNearby(lvl, px);
    for (const o of objects) {
      const py = y;
      if (o.type === 'portal') {
        if (px + pw > o.x && px < o.x + o.w && py + ph > o.y && py < o.y + o.h && mode !== o.mode) {
          mode = o.mode;
          if (mode === 'wave') {
            if (y + ph >= GROUND_Y - 2) y = GROUND_Y - ph - 6;
            if (y <= CEILING_Y + 2) y = CEILING_Y + 6;
          }
        }
      } else if (o.type === 'orb') {
        if (!(mask & o.botBit) && px + pw > o.x - 4 && px < o.x + o.w + 4 &&
            py + ph > o.y - 4 && py < o.y + o.h + 4 && press) {
          mask |= o.botBit; vy = -5.8; grounded = false;
        }
      } else if (o.type === 'pad') {
        if (px + pw > o.x && px < o.x + o.w && py + ph >= o.y + 8 && py < o.y + o.h) {
          vy = -7.2; grounded = false;
        }
      } else if (o.type === 'spike') {
        const sx = o.x + 4, sy = o.dir === 'down' ? o.y + 2 : o.y + 5;
        const sw = o.w - 8, sh = o.h - 7;
        if (px + pw > sx && px < sx + sw) {
          if (py + ph > sy && py < sy + sh) return null;
          clearance = Math.min(clearance, py >= sy + sh ? py - sy - sh : sy - py - ph);
        }
      } else if (o.type === 'block' && px + pw > o.x && px < o.x + o.w) {
        if (py + ph > o.y && py < o.y + o.h) {
          if (mode === 'wave') return null;
          const prevBottom = py + ph - vy;
          if (prevBottom <= o.y + 6 && vy >= 0) { y = o.y - ph; vy = 0; grounded = true; }
          else if (mode === 'ship' && py - vy >= o.y + o.h - 6 && vy <= 0) { y = o.y + o.h; vy = 0; }
          else return null;
        }
        clearance = Math.min(clearance, y >= o.y + o.h ? y - o.y - o.h : o.y - y - ph);
      }
    }
    return { y, vy, grounded, mode, mask, clearance: Math.max(0, clearance) };
  }

  function snapshotBotState(lvl) {
    let mask = 0;
    for (const o of lvl.orbs) if (o.used) mask |= o.botBit;
    return { y: player.y, vy: player.vy, grounded: player.onGround, mode: player.mode, mask };
  }

  function remainingOrbMask(lvl, px) {
    let mask = 0;
    for (const o of lvl.orbs) if (o.x + o.w + 4 >= px) mask |= o.botBit;
    return mask;
  }

  function sameBotState(a, b, mask) {
    return !!b && a.mode === b.mode && a.grounded === b.grounded &&
      Math.abs(a.y - b.y) < 0.0001 && Math.abs(a.vy - b.vy) < 0.0001 &&
      ((a.mask ^ b.mask) & mask) === 0;
  }

  function trainedBotRoute(lvl) {
    if (lvl.botReference !== undefined) return lvl.botReference;
    const data = TRAINED_BOT_ROUTES[levels.indexOf(lvl)];
    if (!data) return (lvl.botReference = null);
    const frames = Math.ceil(lvl.length / lvl.speed);
    const actions = decodeBotRoute(data, frames), states = [];
    let s = { y: GROUND_Y - player.h, vy: 0, grounded: true, mode: 'cube', mask: 0 };
    let cam = 0;
    states.push(s);
    for (let i = 0; i < actions.length; i++) {
      cam += lvl.speed;
      s = botStep(lvl, s, !!actions[i], cam + PLAYER_X);
      if (!s) return (lvl.botReference = null); // level geometry changed: use the adaptive bot
      states.push(s);
    }
    return (lvl.botReference = { actions, states });
  }

  // A slightly different entry height does not necessarily need a full search.
  // First test the trained inputs against the ACTUAL state, including portal
  // momentum. Reuse them only as far as the simulation proves safe.
  function safeReferenceContinuation(lvl, initial, firstFrame, reference) {
    const target = reference && reference.states[firstFrame];
    if (!target || firstFrame < 0 || firstFrame >= reference.actions.length ||
        initial.mode !== target.mode || initial.grounded !== target.grounded ||
        Math.abs(initial.y - target.y) > 6 || Math.abs(initial.vy - target.vy) > 0.55) return null;
    const actions = [], states = [initial];
    let s = initial, simCamera = cameraX;
    for (let i = firstFrame; i < reference.actions.length; i++, simCamera += lvl.speed) {
      const px = simCamera + player.x;
      s = botStep(lvl, s, !!reference.actions[i], px);
      if (!s) break;
      actions.push(!!reference.actions[i]);
      states.push(s);
    }
    const complete = firstFrame + actions.length === reference.actions.length;
    // If a later collision is predicted, leave plenty of time to replan before
    // the dangerous point instead of blindly replaying into an inevitable crash.
    if (!complete && actions.length < 100) return null;
    const commit = complete ? actions.length : Math.min(100, actions.length - 65);
    return { actions, states, startFrame: firstFrame, cursor: 0, commit, guided: true };
  }

  // Replan from the real player state. Unlike a constant-hold rollout, every
  // future tick branches independently; a route can release at a portal and
  // then steer again. A small diverse beam bounds work on phones.
  function searchBotPlan(lvl, initial, firstFrame, reference) {
    let startX = cameraX + player.x; // update() has already advanced the camera
    let exit = null;
    for (const o of lvl.objects) {
      if (o.type === 'portal' && o.mode !== initial.mode && o.x + o.w > startX) { exit = o; break; }
    }
    const toExit = exit ? Math.max(0, Math.floor((exit.x - player.w - startX) / lvl.speed) + 1) : Infinity;
    let horizon = initial.mode === 'cube' ? 72 : 88;
    if (initial.mode === 'wave' && toExit < 320) horizon = Math.max(horizon, toExit + 45);
    else if (toExit < horizon) horizon = Math.max(horizon, toExit + 40);
    horizon = Math.min(360, horizon, Math.ceil((lvl.length - cameraX) / lvl.speed) + 1);
    horizon = Math.max(1, horizon);

    const beamLimit = initial.mode === 'wave' ? 160 : 180;
    let layer = [{ ...initial, score: 0, parent: null, action: false }];
    let depth = 0, simCamera = cameraX;
    for (let f = 0; f < horizon; f++, simCamera += lvl.speed) {
      const px = simCamera + player.x;
      const nearby = botNearby(lvl, px);
      let liveOrbs = 0, orbInReach = false;
      for (const o of nearby) {
        if (o.type === 'orb') {
          liveOrbs |= o.botBit;
          if (px + player.w > o.x - 4 && px < o.x + o.w + 4) orbInReach = true;
        }
      }
      const target = reference && reference.states[Math.min(reference.states.length - 1, firstFrame + f + 1)];
      const next = new Map();
      for (const s of layer) {
        // In mid-air Cube, the only effect of a press is an orb activation.
        const actions = s.mode === 'cube' && !s.grounded && !orbInReach ? 1 : 2;
        for (let a = 0; a < actions; a++) {
          const n = botStep(lvl, s, !!a, px, nearby);
          if (!n) continue;
          // Used orbs behind the player cannot affect any future step.
          n.mask &= liveOrbs;
          const yq = Math.round(n.y * (n.mode === 'wave' ? 2 : 1));
          const vq = Math.round(n.vy * 4);
          const key = n.mode[0] + '|' + yq + '|' + vq + '|' + (+n.grounded) + '|' + n.mask;
          const referenceCost = target && target.mode === n.mode
            ? Math.min(140, Math.abs(n.y - target.y)) * 0.17 + Math.abs(n.vy - target.vy) * 0.7
            : target ? 10 : 0;
          const safety = n.mode === 'cube' ? (n.grounded ? 3 : 2) : Math.min(n.clearance, 24) * 0.25;
          const toggled = a !== (s.lastAction || 0);
          const styleBonus = botStyle === 'least' ? (toggled ? -1.2 : 0) : (toggled ? 1.2 : 0);
          n.lastAction = a;
          n.score = s.score * 0.97 + safety - referenceCost - (a !== +s.action ? 0.12 : 0);
          const old = next.get(key);
          if (!old || n.score > old.score) {
            n.parent = s;
            n.action = !!a;
            next.set(key, n);
          }
        }
      }
      if (!next.size) break;
      layer = [...next.values()];
      if (layer.length > beamLimit) {
        layer.sort((a, b) => b.score - a.score);
        // Keep different heights AND velocities, not only the nearest line to
        // the reference. This leaves room to brake or take an alternate opening.
        const keep = [], groups = new Set();
        for (const n of layer) {
          const group = n.mode[0] + '|' + Math.floor(n.y / 12) + '|' + Math.floor((n.vy + 7) / 2);
          if (!groups.has(group)) {
            groups.add(group); n.chosen = true; keep.push(n);
            if (keep.length >= beamLimit / 2) break;
          }
        }
        for (const n of layer) {
          if (!n.chosen) keep.push(n);
          if (keep.length >= beamLimit) break;
        }
        layer = keep;
      }
      depth++;
    }
    if (!depth) return null;
    let best = layer[0];
    for (const n of layer) if (n.score > best.score) best = n;
    const actions = [], states = [];
    while (best.parent) {
      actions.push(best.action);
      states.push(best);
      best = best.parent;
    }
    actions.reverse(); states.reverse(); states.unshift(initial);
    // A wave route covers its next portal plus 45 ship/cube ticks. Following
    // most of it avoids repeated expensive searches in long wave corridors.
    const commit = initial.mode === 'wave' && toExit < 320 && depth >= toExit + 30
      ? Math.max(1, Math.min(depth - 25, toExit + 8))
      : Math.min(depth, 28);
    return { actions, states, startFrame: firstFrame, cursor: 0, commit };
  }

  function setBotInput(press) {
    jumpPressed = !!press && !holding;
    holding = !!press;
  }

  function updateBot(lvl) {
    const firstFrame = Math.round(cameraX / lvl.speed) - 1;
    const px = cameraX + player.x;
    const actual = snapshotBotState(lvl);
    const relevantOrbs = remainingOrbMask(lvl, px);
    const reference = botStyle === 'spam' ? null : trainedBotRoute(lvl);
    if (reference && firstFrame >= 0 && firstFrame < reference.actions.length &&
        sameBotState(actual, reference.states[firstFrame], relevantOrbs)) {
      botPlan = null;
      setBotInput(reference.actions[firstFrame]);
      return;
    }
    if (reference && (!botPlan || !botPlan.guided) && firstFrame >= botReferenceRetryFrame) {
      botReferenceRetryFrame = firstFrame + 16;
      const continuation = safeReferenceContinuation(lvl, actual, firstFrame, reference);
      if (continuation) botPlan = continuation;
    }
    if (!botPlan || botPlan.startFrame + botPlan.cursor !== firstFrame ||
        botPlan.cursor >= botPlan.commit ||
        !sameBotState(actual, botPlan.states[botPlan.cursor], relevantOrbs)) {
      botPlan = searchBotPlan(lvl, actual, firstFrame, reference);
    }
    if (botPlan && botPlan.cursor < botPlan.actions.length) {
      setBotInput(botPlan.actions[botPlan.cursor++]);
    } else {
      // A state can already be unrecoverable. Still take a survivable next step
      // if one exists, rather than forcing a hold when entering a portal.
      const near = botNearby(lvl, px);
      const release = botStep(lvl, actual, false, px, near);
      const press = botStep(lvl, actual, true, px, near);
      setBotInput(!release && !!press);
    }
  }

  // ---------- UPDATE ----------
  function update() {
    frameCount++;
    prevCamX = cameraX; prevPY = player.y; prevRot = player.rot; prevPX = player.x;

    if (shakeTimer > 0) shakeTimer--;
    if (modeBannerTimer > 0) modeBannerTimer--;
    if (flash > 0) flash -= 0.04;
    if (ringR > 0) ringR += 7;
    wallPulse++;
    updateParticles();

    if (state === 'dead') {
      if (--deadTimer <= 0) { attempts++; resetRun(); state = 'playing'; }
      return;
    }
    if (state === 'ending') { updateEnding(); return; }
    if (state === 'win') { winTimer++; ambientWallSparks(); return; }
    if (state !== 'playing') return;

    const lvl = levels[currentLevelIdx];
    updateBeat();
    cameraX += lvl.speed;
    const worldX = cameraX + player.x;

    if (botMode) updateBot(lvl);

    if (player.mode === 'cube') {
      if (holding && player.onGround) {
        player.vy = -5.6;
        player.onGround = false;
        sfx.jump();
      }
      player.vy += 0.34;
      if (player.vy > 7) player.vy = 7;
      player.y += player.vy;
      if (!player.onGround) player.rot += 0.16;
      else player.rot = Math.round(player.rot / (Math.PI / 2)) * (Math.PI / 2);
    } else if (player.mode === 'ship') {
      player.vy += holding ? -0.28 : 0.24;
      player.vy = Math.max(-4.0, Math.min(4.0, player.vy));
      player.y += player.vy;
      player.rot = player.vy * 0.12;
    } else {
      const waveSpeed = lvl.speed * 0.95;
      player.vy = holding ? -waveSpeed : waveSpeed;
      player.y += player.vy;
      player.rot = holding ? -Math.PI / 4 : Math.PI / 4;
    }

    player.onGround = false;
    if (player.y + player.h >= GROUND_Y) {
      if (player.mode === 'wave' && currentLevelIdx > 0) { killPlayer(); return; }
      player.y = GROUND_Y - player.h;
      player.vy = 0;
      player.onGround = true;
    }
    if (player.y <= CEILING_Y) {
      if (player.mode === 'wave' && currentLevelIdx > 0) { killPlayer(); return; }
      player.y = CEILING_Y;
      player.vy = 0;
    }

    const px = worldX, pw = player.w, ph = player.h;
    const objs = lvl.objects;
    const start = firstIndex(objs, px - lvl.maxW - 8);
    const endLimit = px + pw + 8;

    for (let k = start; k < objs.length; k++) {
      const obj = objs[k];
      if (obj.x > endLimit) break;           // sorted → nothing further can touch us
      if (obj.x + obj.w < px - 8) continue;
      const py = player.y;

      if (obj.type === 'portal') {
        if (px + pw > obj.x && px < obj.x + obj.w && py + ph > obj.y && py < obj.y + obj.h) {
          if (player.mode !== obj.mode) {
            cubeAfterWave = player.mode === 'wave' && obj.mode === 'cube';
            player.mode = obj.mode;
            trailLen = 0;
            if (obj.mode === 'wave') {
              if (player.y + player.h >= GROUND_Y - 2) player.y = GROUND_Y - player.h - 6;
              if (player.y <= CEILING_Y + 2) player.y = CEILING_Y + 6;
            }
            modeBanner = obj.mode.toUpperCase() + ' MODE!';
            modeBannerTimer = 60;
            sfx.portal();
            spawnParticles(player.x + pw / 2, player.y + ph / 2, '#ffffff', 12);
          }
        }
      } else if (obj.type === 'orb') {
        if (!obj.used && px + pw > obj.x - 4 && px < obj.x + obj.w + 4 && py + ph > obj.y - 4 && py < obj.y + obj.h + 4) {
          if (jumpPressed || holding) {
            obj.used = true;
            player.vy = -5.8;
            player.onGround = false;
            sfx.orb();
            spawnParticles(player.x + pw / 2, player.y + ph / 2, '#ffea00', 10);
          }
        }
      } else if (obj.type === 'pad') {
        if (px + pw > obj.x && px < obj.x + obj.w && py + ph >= obj.y + 8 && py < obj.y + obj.h) {
          player.vy = -7.2;
          player.onGround = false;
          sfx.orb();
          spawnParticles(player.x + pw / 2, player.y + ph, '#ff2a85', 8);
        }
      } else if (obj.type === 'spike') {
        const sx = obj.x + 4;
        const sy = obj.dir === 'down' ? obj.y + 2 : obj.y + 5;
        if (px + pw > sx && px < sx + obj.w - 8 && py + ph > sy && py < sy + obj.h - 7) {
          killPlayer(); return;
        }
      } else if (obj.type === 'block') {
        if (px + pw > obj.x && px < obj.x + obj.w && py + ph > obj.y && py < obj.y + obj.h) {
          if (player.mode === 'wave') { killPlayer(); return; }
          const prevBottom = py + ph - player.vy;
          if (prevBottom <= obj.y + 6 && player.vy >= 0) {
            player.y = obj.y - ph;
            player.vy = 0;
            player.onGround = true;
          } else if (player.mode === 'ship' && py - player.vy >= obj.y + obj.h - 6 && player.vy <= 0) {
            player.y = obj.y + obj.h;
            player.vy = 0;
          } else {
            killPlayer(); return;
          }
        }
      }
    }

    jumpPressed = false;

    if (player.mode === 'wave') pushTrail(worldX + pw / 2, player.y + ph / 2);

    const pct = Math.min(100, Math.floor((cameraX / lvl.length) * 100));
    if (!botMode && pct > bestProgress[currentLevelIdx]) bestProgress[currentLevelIdx] = pct;

    if (cameraX >= lvl.length) {
      cameraX = lvl.length;
      if (!botMode) bestProgress[currentLevelIdx] = 100;
      state = 'ending';
      endTimer = 0;
      sfx.whoosh();
    }
  }

  function pushTrail(x, y) {
    trailX[trailHead] = x; trailY[trailHead] = y;
    trailHead = (trailHead + 1) % TRAIL_MAX;
    if (trailLen < TRAIL_MAX) trailLen++;
  }

  // Player auto-flies into the finish wall, then BOOM
  function updateEnding() {
    const lvl = levels[currentLevelIdx];
    endTimer++;
    const targetY = (CEILING_Y + GROUND_Y) / 2 - player.h / 2;
    if (!impactDone) {
      const spd = Math.min(9, 2 + endTimer * 0.22);
      player.x += spd;
      player.y += (targetY - player.y) * 0.08 - Math.sin(endTimer * 0.12) * 0.6;
      player.rot += player.mode === 'cube' ? 0.3 : 0.12;
      if (player.mode === 'wave') pushTrail(cameraX + player.x + player.w / 2, player.y + player.h / 2);
      // speed streak behind the player
      if (frameCount % 2 === 0) emit(player.x, player.y + 3 + Math.random() * 8, -2 - Math.random() * 2, 0, 14, 2, lvl.playerColor, 0);
      if (player.x + player.w >= WALL_SCREEN_X) {
        impactDone = true;
        flash = 1;
        ringR = 4;
        shakeTimer = 18;
        sfx.boom();
        sfx.win();
        const cx = WALL_SCREEN_X, cy = player.y + player.h / 2;
        const cols = [lvl.accent, lvl.playerColor, '#fff', '#ffea00', '#ff2a85', '#00e5ff'];
        for (let i = 0; i < 90; i++) {
          const ang = Math.PI * 0.5 + Math.random() * Math.PI;   // burst back toward the player
          const s = 1.5 + Math.random() * 5.5;
          emit(cx, cy, Math.cos(ang) * s, Math.sin(ang) * s - 1.5, 40 + Math.random() * 40,
            2 + ((Math.random() * 3) | 0), cols[i % cols.length], 0.09);
        }
      }
    } else {
      ambientWallSparks();
      if (endTimer > 0 && flash <= 0.2 && ringR > 220) {
        state = 'win';
        winTimer = 0;
      }
    }
  }

  function ambientWallSparks() {
    const lvl = levels[currentLevelIdx];
    if (frameCount % 3 === 0) {
      const wx = WALL_SCREEN_X + Math.random() * (W - WALL_SCREEN_X);
      emit(wx, GROUND_Y - 2, (Math.random() - 0.5) * 0.6, -1 - Math.random() * 1.8, 50, 2,
        Math.random() < 0.5 ? lvl.accent : '#fff', -0.01);
    }
  }

  function killPlayer() {
    state = 'dead';
    deadTimer = 30;
    shakeTimer = 10;
    sfx.crash();
    spawnParticles(player.x + player.w / 2, player.y + player.h / 2, levels[currentLevelIdx].playerColor, 22);
  }

  // ---------- RENDER ----------
  function drawBackground(lvl, scrollX) {
    const g = lvl.gfx;
    const farOff = ((scrollX * 0.12) | 0) % 128;
    ctx.drawImage(g.far, -farOff, 0);
    const bgOff = ((scrollX * 0.25) | 0) % 64;
    ctx.drawImage(g.bg, -bgOff, 0);
    const stOff = ((scrollX * 0.1) | 0) % W;
    ctx.drawImage(g.st, -stOff, 0);
  }

  function drawGround(lvl, scrollX) {
    const gOff = (scrollX | 0) % TILE;
    ctx.drawImage(lvl.gfx.gr, -gOff, 0);
  }

  function drawObjects(lvl) {
    const camX = viewCamX | 0;
    // static layer (blocks + spikes) = ONE sliced drawImage
    const sc = lvl.staticC;
    if (sc) {
      const sx = Math.max(0, Math.min(camX, sc.width - W));
      ctx.drawImage(sc, sx, 0, W, H, 0, 0, W, H);
    }
    // animated objects only: portals, pads, orbs
    const objs = lvl.dynObjs;
    const start = firstIndex(objs, camX - 32);
    const maxX = camX + W + 32;
    const f4 = (frameCount >> 3) & 3;
    const bob = (Math.sin(frameCount * 0.15) * 1.5) | 0;
    for (let k = start; k < objs.length; k++) {
      const o = objs[k];
      if (o.x > maxX) break;
      const sx = o.x - camX;
      if (sx + o.w < -8) continue;
      if (o.type === 'orb') ctx.drawImage(o.used ? SPR_ORB_USED : SPR_ORB[(frameCount >> 3) % 3], sx, o.y + (o.used ? 0 : bob));
      else if (o.type === 'pad') ctx.drawImage(SPR_PAD[(frameCount >> 4) & 1], sx, o.y);
      else ctx.drawImage(SPR_PORTAL[o.mode][f4], sx - 4, o.y);
    }
  }

  // ---- THE FINISH WALL ----
  function drawFinishWall(lvl) {
    const wx = (lvl.endX - viewCamX) | 0;     // screen x of wall face
    if (wx > W + 100) return;
    const top = CEILING_Y, bot = GROUND_Y, hgt = bot - top;
    const t = wallPulse;
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.1);
    const g = lvl.gfx;

    // approach chevrons sweeping toward the wall (single strip draw)
    const chevOff = (t * 1.5) % 34;
    ctx.globalAlpha = 0.35 + 0.3 * pulse;
    ctx.drawImage(SPR_CHEV, wx - 40 - chevOff, top);
    ctx.globalAlpha = 1;

    // glow halo
    ctx.globalAlpha = 0.45 + 0.4 * pulse + (impactDone ? 0.3 : 0);
    ctx.drawImage(g.glow, wx - 96, top);
    ctx.globalAlpha = 1;

    // main body
    ctx.fillStyle = '#05060c';
    ctx.fillRect(wx, top, W - wx + 120, hgt);

    // scrolling checker "finish flag" column (cached pattern = one fill)
    const scroll = (t * 0.6) % 16;
    ctx.save();
    ctx.beginPath(); ctx.rect(wx + 4, top, W - wx + 120, hgt); ctx.clip();
    ctx.setTransform(1, 0, 0, 1, shakeX, shakeY - scroll);
    ctx.fillStyle = WALL_PAT;
    ctx.fillRect(wx + 4, top + scroll, W - wx + 120, hgt);
    ctx.restore();
    ctx.setTransform(1, 0, 0, 1, shakeX, shakeY);

    // neon edges
    ctx.fillStyle = lvl.accent;
    ctx.fillRect(wx, top, 4, hgt);
    ctx.fillRect(wx + 20, top, 2, hgt);
    ctx.globalAlpha = 0.5 + 0.5 * pulse;
    ctx.fillStyle = '#fff';
    ctx.fillRect(wx + 1, top, 2, hgt);
    ctx.globalAlpha = 1;

    // energy bars inside wall
    for (let i = 0; i < 4; i++) {
      const bx = wx + 30 + i * 14;
      const lvlH = ((Math.sin(t * 0.08 + i * 1.3) * 0.5 + 0.5) * (hgt - 40)) | 0;
      ctx.fillStyle = i & 1 ? lvl.playerColor : lvl.accent;
      ctx.globalAlpha = 0.35;
      ctx.fillRect(bx, top + 20, 6, hgt - 40);
      ctx.globalAlpha = 1;
      ctx.fillRect(bx, bot - 20 - lvlH, 6, lvlH);
    }

    // scanning beam sweeping up and down
    const beamY = top + ((Math.sin(t * 0.05) * 0.5 + 0.5) * (hgt - 6)) | 0;
    ctx.fillStyle = '#fff';
    ctx.globalAlpha = 0.8;
    ctx.fillRect(wx - 6, beamY, W - wx + 6, 2);
    ctx.globalAlpha = 0.25;
    ctx.fillRect(wx - 6, beamY - 3, W - wx + 6, 8);
    ctx.globalAlpha = 1;

    // vertical "FINISH" letters
    ctx.font = 'bold 12px Courier New';
    ctx.textAlign = 'center';
    const letters = 'FINISH';
    const lx = Math.min(W - 14, wx + 52);
    for (let i = 0; i < letters.length; i++) {
      const ly = top + 48 + i * 22;
      ctx.fillStyle = '#000';
      ctx.fillText(letters[i], lx + 1, ly + 1);
      ctx.fillStyle = (((t >> 3) + i) % 6 === 0) ? lvl.accent : '#fff';
      ctx.fillText(letters[i], lx, ly);
    }

    // impact white-out on the wall face
    if (impactDone && flash > 0) {
      ctx.globalAlpha = Math.min(1, flash);
      ctx.fillStyle = '#fff';
      ctx.fillRect(wx, top, W - wx, hgt);
      ctx.globalAlpha = 1;
    }
  }

  function drawPlayer(lvl) {
    if (state === 'dead') return;
    if (state === 'ending' && impactDone) return;
    if (state === 'win') return;
    const g = lvl.gfx;

    if (player.mode === 'wave' && trailLen > 1) {
      ctx.strokeStyle = lvl.playerColor;
      ctx.lineWidth = 4;
      ctx.beginPath();
      const startI = (trailHead - trailLen + TRAIL_MAX) % TRAIL_MAX;
      for (let n = 0; n < trailLen; n++) {
        const i = (startI + n) % TRAIL_MAX;
        const sx = trailX[i] - viewCamX;
        if (n === 0) ctx.moveTo(sx, trailY[i]); else ctx.lineTo(sx, trailY[i]);
      }
      ctx.lineTo(viewPX + player.w / 2, viewPY + player.h / 2);
      ctx.stroke();
    }

    const spr = player.mode === 'cube' ? g.cube : player.mode === 'ship' ? g.ship[(frameCount >> 3) & 1] : g.wave;
    const cx = (viewPX + player.w / 2) | 0, cy = (viewPY + player.h / 2) | 0;
    const c = Math.cos(viewRot), s = Math.sin(viewRot);
    ctx.setTransform(c, s, -s, c, cx + shakeX, cy + shakeY);
    ctx.drawImage(spr, -(spr.width >> 1), -(spr.height >> 1));
    ctx.setTransform(1, 0, 0, 1, shakeX, shakeY);
  }

  // ---- cached HUD (text only re-rasterised when it changes) ----
  const [hudC, hudG] = makeCanvas(W, 64);
  let hudKey = '';
  let fpsValue = 60, fpsFrames = 0, fpsLast = performance.now();
  function drawHUD(lvl) {
    const pct = Math.min(100, Math.floor((cameraX / lvl.length) * 100));
    const bannerOn = modeBannerTimer > 0;
    const key = pct + '|' + attempts + '|' + (bannerOn ? modeBanner : '') + '|' + currentLevelIdx + '|' + fpsValue;
    if (key !== hudKey) {
      hudKey = key;
      hudG.clearRect(0, 0, W, 64);
      const barW = 180, barX = (W - barW) / 2;
      hudG.fillStyle = 'rgba(0,0,0,0.6)'; hudG.fillRect(barX, 10, barW, 8);
      hudG.fillStyle = lvl.accent; hudG.fillRect(barX, 10, Math.floor((barW * pct) / 100), 8);
      hudG.strokeStyle = '#fff'; hudG.lineWidth = 1; hudG.strokeRect(barX + 0.5, 10.5, barW - 1, 7);
      hudG.fillStyle = '#fff'; hudG.font = 'bold 10px Courier New'; hudG.textAlign = 'center';
      hudG.fillText(pct + '%  •  ATTEMPT ' + attempts, W / 2, 30);
      hudG.fillStyle = fpsValue >= 55 ? '#39ff14' : fpsValue >= 30 ? '#ffea00' : '#ff3355';
      hudG.font = 'bold 8px Courier New'; hudG.textAlign = 'left';
      hudG.fillText('FPS:' + diagAvgFps + ' (' + diagMs.toFixed(1) + 'ms) 1%:' + diagLow1 + ' SPK:' + diagSpikes, 10, 44);
      hudG.textAlign = 'center';
      if (bannerOn) {
        hudG.fillStyle = '#000'; hudG.font = 'bold 14px Courier New';
        hudG.fillText(modeBanner, W / 2 + 1, 55);
        hudG.fillStyle = '#ffea00';
        hudG.fillText(modeBanner, W / 2, 54);
      }
    }
    ctx.drawImage(hudC, 0, 0);
  }

  // ---- cached menu ----
  const [menuC, menuG] = makeCanvas(W, H);
  let menuDirty = true;
  const FACE_COLS = { EASY: '#39ff14', NORMAL: '#00e5ff', HARD: '#ff9900', INSANE: '#ff2a85', DEMON: '#ff2244' };
  function drawDiffFace(g, diff, cx, cy) {
    const col = FACE_COLS[diff] || '#ff2a85';
    const x0 = cx - 12, y0 = cy - 12;
    if (diff === 'INSANE' || diff === 'DEMON') {           // pixel horns
      g.fillStyle = '#000';
      g.fillRect(x0 - 1, y0 - 5, 6, 6); g.fillRect(x0 + 11, y0 - 5, 6, 6);
      g.fillStyle = col;
      g.fillRect(x0, y0 - 4, 4, 4); g.fillRect(x0 + 12, y0 - 4, 4, 4);
    }
    g.fillStyle = '#000'; g.fillRect(x0 - 1, y0 - 1, 26, 26);
    g.fillStyle = col; g.fillRect(x0, y0, 24, 24);
    g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(x0 + 2, y0 + 2, 8, 2);
    if (diff === 'EASY' || diff === 'NORMAL') {
      g.fillStyle = '#000';
      g.fillRect(x0 + 5, y0 + 8, 4, 5); g.fillRect(x0 + 15, y0 + 8, 4, 5);
      g.fillStyle = '#fff'; g.fillRect(x0 + 6, y0 + 9, 1, 2); g.fillRect(x0 + 16, y0 + 9, 1, 2);
      if (diff === 'EASY') {                                // big smile + rosy cheeks
        g.fillStyle = '#000';
        g.fillRect(x0 + 6, y0 + 17, 12, 3); g.fillRect(x0 + 4, y0 + 15, 2, 2); g.fillRect(x0 + 18, y0 + 15, 2, 2);
        g.fillStyle = 'rgba(255,120,160,0.85)';
        g.fillRect(x0 + 2, y0 + 14, 3, 2); g.fillRect(x0 + 19, y0 + 14, 3, 2);
      } else {                                              // flat mouth
        g.fillStyle = '#000'; g.fillRect(x0 + 7, y0 + 17, 10, 2);
      }
    } else {
      g.fillStyle = '#000';                                 // angry slanted eyes
      g.fillRect(x0 + 4, y0 + 7, 6, 3); g.fillRect(x0 + 14, y0 + 7, 6, 3);
      g.fillRect(x0 + 4, y0 + 10, 3, 2); g.fillRect(x0 + 17, y0 + 10, 3, 2);
      g.fillStyle = '#fff'; g.fillRect(x0 + 8, y0 + 8, 2, 1); g.fillRect(x0 + 15, y0 + 8, 2, 1);
      if (diff === 'DEMON') {                               // fanged maw
        g.fillStyle = '#000'; g.fillRect(x0 + 5, y0 + 16, 14, 4);
        g.fillStyle = '#fff';
        g.fillRect(x0 + 6, y0 + 16, 3, 2); g.fillRect(x0 + 11, y0 + 16, 3, 2); g.fillRect(x0 + 16, y0 + 16, 2, 2);
      } else if (diff === 'INSANE') {                       // jagged grin
        g.fillStyle = '#000'; g.fillRect(x0 + 5, y0 + 16, 14, 3);
        g.fillStyle = '#fff';
        g.fillRect(x0 + 7, y0 + 16, 2, 1); g.fillRect(x0 + 11, y0 + 16, 2, 1); g.fillRect(x0 + 15, y0 + 16, 2, 1);
      } else {                                              // HARD frown
        g.fillStyle = '#000';
        g.fillRect(x0 + 6, y0 + 18, 12, 2); g.fillRect(x0 + 4, y0 + 16, 2, 2); g.fillRect(x0 + 18, y0 + 16, 2, 2);
      }
    }
  }
  function drawMenu() {
    if (menuDirty) {
      menuDirty = false;
      const g = menuG;
      g.fillStyle = '#090b18'; g.fillRect(0, 0, W, H);
      // Pixel grid + subtle horizon glow
      g.fillStyle = '#111633';
      g.fillRect(0, 170, W, 100);
      g.fillStyle = 'rgba(0, 245, 212, 0.06)';
      for (let x = 0; x < W; x += 16) g.fillRect(x, 0, 1, H);
      for (let y = 0; y < H; y += 16) g.fillRect(0, y, W, 1);
      // Twinkling pixel stars
      g.fillStyle = 'rgba(255,255,255,0.35)';
      for (let i = 0; i < 24; i++) {
        g.fillRect((i * 71) % W, 10 + ((i * 37) % 140), 2, 2);
      }

      // 3D Pixel Title
      g.textAlign = 'center';
      g.font = 'bold 30px Courier New';
      g.fillStyle = '#000'; g.fillText('PIXEL DASH', W / 2 + 3, 45);
      g.fillStyle = '#0077b6'; g.fillText('PIXEL DASH', W / 2 + 1, 43);
      g.fillStyle = '#00f5d4'; g.fillText('PIXEL DASH', W / 2, 42);
      g.fillStyle = '#00f5d4'; g.fillRect(W / 2 - 96, 50, 192, 2);

      // Total stars badge
      let starsEarned = 0;
      for (let i = 0; i < levels.length; i++) if (bestProgress[i] >= 100) starsEarned++;
      g.fillStyle = '#ffea00'; g.font = 'bold 9px Courier New';
      g.fillText('★ ' + starsEarned + ' / ' + levels.length + ' LEVELS COMPLETE  •  TAP A LEVEL TO PLAY', W / 2, 68);
      // Tabs: MAIN | EXTRA
      g.fillStyle = menuTab === 0 ? '#00f5d4' : '#1b2659';
      g.fillRect(150, 72, 86, 16);
      g.strokeStyle = '#00f5d4'; g.lineWidth = 1.5; g.strokeRect(150, 72, 86, 16);
      g.fillStyle = menuTab === 0 ? '#000' : '#fff'; g.font = 'bold 9px Courier New';
      g.fillText('MAIN (1-5)', 193, 83);

      g.fillStyle = menuTab === 1 ? '#ff2a85' : '#1b2659';
      g.fillRect(244, 72, 86, 16);
      g.strokeStyle = '#ff2a85'; g.lineWidth = 1.5; g.strokeRect(244, 72, 86, 16);
      g.fillStyle = menuTab === 1 ? '#000' : '#fff';
      g.fillText('EXTRA (6-8)', 287, 83);

      const count = menuTab === 0 ? 5 : 3;
      const startIdx = menuTab === 0 ? 0 : 5;
      for (let k = 0; k < count; k++) {
        const i = startIdx + k;
        if (i >= levels.length) break;
        const lvl = levels[i];
        const bx = menuTab === 0 ? (16 + k * 91) : (42 + k * 136);
        const by = 96;
        const bw = menuTab === 0 ? 84 : 124;
        const bh = 126;
        g.fillStyle = '#000'; g.fillRect(bx + 3, by + 3, bw, bh);
        g.fillStyle = lvl.bg1; g.fillRect(bx, by, bw, bh);
        g.strokeStyle = lvl.accent; g.lineWidth = 2; g.strokeRect(bx, by, bw, bh);

        // 2D pixel-art difficulty face + level number badge
        drawDiffFace(g, lvl.diff, bx + bw / 2, by + 27);
        g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(bx + 3, by + 3, 14, 12);
        g.fillStyle = '#fff'; g.font = 'bold 9px Courier New'; g.textAlign = 'left';
        g.fillText(String(i + 1), bx + 6, by + 12);
        g.textAlign = 'center';

        g.fillStyle = '#fff'; g.font = 'bold 9px Courier New';
        g.fillText(lvl.name.split(' ')[0], bx + bw / 2, by + 48);
        g.fillStyle = lvl.accent; g.font = 'bold 8px Courier New';
        g.fillText(lvl.diff, bx + bw / 2, by + 60);
        g.fillStyle = '#ccc'; g.font = '8px Courier New';
        g.fillText('BEST: ' + bestProgress[i] + '%', bx + bw / 2, by + 84);
        g.fillStyle = '#000'; g.fillRect(bx + 8, by + 90, bw - 16, 7);
        g.fillStyle = lvl.accent;
        g.fillRect(bx + 8, by + 90, Math.floor(((bw - 16) * bestProgress[i]) / 100), 7);
        if (bestProgress[i] >= 100) {
          g.fillStyle = '#ffea00'; g.font = 'bold 8px Courier New';
          g.fillText('★ DONE ★', bx + bw / 2, by + 73);
        }
        g.fillStyle = '#fff'; g.font = 'bold 9px Courier New';
        g.fillText('[ PLAY ]', bx + bw / 2, by + 120);
      }
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(menuC, 0, 0);
  }

  function drawWin(lvl) {
    const tIn = Math.min(1, winTimer / 18);
    const ease = 1 - Math.pow(1 - tIn, 3);
    ctx.globalAlpha = 0.75 * ease;
    ctx.fillStyle = '#0a0c19';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;

    const pw = 300, ph = 140;
    const px = (W - pw) / 2, py = ((H - ph) / 2 + (1 - ease) * 60) | 0;
    ctx.fillStyle = '#000'; ctx.fillRect(px + 4, py + 4, pw, ph);
    ctx.fillStyle = '#12152a'; ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = lvl.accent;
    ctx.fillRect(px, py, pw, 3); ctx.fillRect(px, py + ph - 3, pw, 3);
    ctx.fillRect(px, py, 3, ph); ctx.fillRect(px + pw - 3, py, 3, ph);

    ctx.textAlign = 'center';
    ctx.font = 'bold 22px Courier New';
    ctx.fillStyle = '#000'; ctx.fillText('LEVEL COMPLETE!', W / 2 + 2, py + 36);
    ctx.fillStyle = (winTimer >> 3) & 1 ? '#fff' : lvl.accent;
    ctx.fillText('LEVEL COMPLETE!', W / 2, py + 34);

    // stars pop in one by one
    for (let i = 0; i < 3; i++) {
      const appear = winTimer - 14 - i * 8;
      if (appear < 0) continue;
      const sc = Math.min(1.4, appear / 5) > 1 ? Math.max(1, 1.4 - (appear - 5) * 0.08) : appear / 5;
      const sx = W / 2 + (i - 1) * 40, sy = py + 66;
      ctx.setTransform(sc, 0, 0, sc, sx, sy);
      drawPixelStar();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    ctx.fillStyle = '#fff'; ctx.font = FONT_M;
    ctx.fillText(lvl.name + '  •  ATTEMPTS: ' + attempts, W / 2, py + 104);
    if (winTimer > 30 && (winTimer >> 4) & 1) {
      ctx.fillStyle = '#aaa'; ctx.font = FONT_S;
      ctx.fillText('TAP OR PRESS SPACE FOR MENU', W / 2, py + 124);
    }
  }

  const SPR_STAR = (() => {
    const [c, g] = makeCanvas(28, 28);
    const path = (ox, oy) => {
      g.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i & 1 ? 5.5 : 13, a = -Math.PI / 2 + i * Math.PI / 5;
        const x = 14 + ox + Math.cos(a) * r, y = 14.5 + oy + Math.sin(a) * r;
        i ? g.lineTo(x, y) : g.moveTo(x, y);
      }
      g.closePath();
    };
    path(1, 1); g.fillStyle = '#000'; g.fill();
    path(0, 0); g.fillStyle = '#ffea00'; g.fill();
    g.lineWidth = 1.5; g.strokeStyle = '#fff8a0'; g.stroke();
    g.fillStyle = '#fff'; g.fillRect(11, 8, 3, 3);
    return c;
  })();
  function drawPixelStar() { ctx.drawImage(SPR_STAR, -14, -14); }

  let shakeX = 0, shakeY = 0;
  function render() {
    if (state === 'menu') { drawMenu(); return; }
    const lvl = levels[currentLevelIdx];

    if (shakeTimer > 0) {
      const m = shakeTimer > 12 ? 8 : 6;
      shakeX = ((Math.random() - 0.5) * m) | 0;
      shakeY = ((Math.random() - 0.5) * m) | 0;
    } else { shakeX = 0; shakeY = 0; }

    ctx.setTransform(1, 0, 0, 1, shakeX, shakeY);
    drawBackground(lvl, viewCamX);
    drawGround(lvl, viewCamX);
    drawObjects(lvl);
    if (practiceMode && checkpoints.length > 0) {
      for (let i = 0; i < checkpoints.length; i++) {
        const cp = checkpoints[i];
        const cpx = (cp.cameraX + PLAYER_X + 7 - viewCamX) | 0;
        const cpy = (cp.y + 7) | 0;
        if (cpx > -16 && cpx < W + 16) {
          ctx.globalAlpha = i === checkpoints.length - 1 ? 1 : 0.45;
          ctx.drawImage(SPR_CP, cpx - 6, cpy - 7);
          ctx.globalAlpha = 1;
        }
      }
    }
    drawFinishWall(lvl);
    drawPlayer(lvl);
    drawParticles(0);

    // expanding shockwave ring on impact
    if (ringR > 0 && ringR < 400) {
      const cx = WALL_SCREEN_X, cy = (CEILING_Y + GROUND_Y) / 2;
      ctx.globalAlpha = Math.max(0, 1 - ringR / 400);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(cx, cy, ringR, 0, 6.2832); ctx.stroke();
      ctx.strokeStyle = lvl.accent;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, ringR * 0.7, 0, 6.2832); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    if (flash > 0) {
      ctx.globalAlpha = Math.min(0.85, flash * 0.85);
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
    if (state !== 'win') drawHUD(lvl);
    if (state === 'win') drawWin(lvl);
  }

  // ---------- FIXED TIMESTEP LOOP + DIAGNOSTICS ----------
  const STEP = 1000 / 60;
  let lastTime = 0;
  let acc = 0;
  const ftBuf = new Float32Array(60);
  let ftIdx = 0, ftCount = 0;
  let diagAvgFps = 60, diagMs = 16.7, diagLow1 = 60, diagSpikes = 0;

  function loop(t) {
    requestAnimationFrame(loop);
    if (!lastTime) { lastTime = t; render(); return; }
    let dt = t - lastTime;
    lastTime = t;

    // Record real frame-time diagnostics
    ftBuf[ftIdx] = dt;
    ftIdx = (ftIdx + 1) % 60;
    if (ftCount < 60) ftCount++;
    if (dt > 25 && dt < 500) diagSpikes++;
    if (ftIdx === 0 && ftCount === 60) {
      let sum = 0, maxDt = 0;
      for (let i = 0; i < 60; i++) {
        const v = ftBuf[i];
        sum += v;
        if (v > maxDt) maxDt = v;
      }
      diagMs = sum / 60;
      diagAvgFps = Math.round(1000 / Math.max(1, diagMs));
      diagLow1 = Math.round(1000 / Math.max(1, maxDt));
      fpsValue = diagAvgFps;
    }

    if (dt > 100) dt = STEP;           // tab switch / hitch → resume cleanly, no catch-up burst
    acc += dt;
    let steps = 0;
    while (acc >= STEP && steps < 3) { update(); acc -= STEP; steps++; }
    if (steps === 3) acc = 0;

    const a = Math.min(1, acc / STEP);
    viewCamX = prevCamX + (cameraX - prevCamX) * a;
    viewPY = prevPY + (player.y - prevPY) * a;
    viewRot = prevRot + (player.rot - prevRot) * a;
    viewPX = prevPX + (player.x - prevPX) * a;
    render();
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) { lastTime = 0; acc = 0; }
    holding = false;
  });

  requestAnimationFrame(loop);
})();
</script>
